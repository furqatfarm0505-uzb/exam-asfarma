 курашмайди ва уларнинг дозасини бузмайди.", "ar": "Пожилые пациенты часто страдают коморбидностью и принимают кардиоваскулярные, сахароснижающие и антикоагулянтные препараты. Эвалеп практически не связывается с белками плазмы (менее 10%) и выводится почками, исключая риск нежелательных фармакокинетических взаимодействий при полипрагмазии."}, {"qu": "Эвалеп тутқаноқнинг қайси турларида ишлатилади (таъсир спектри)?", "qr": "Каков спектр антиэпилептической активности Эвалеп по сравнению с препаратами узкого спектра?", "au": "Эвалеп — кенг спектрли антиэпилептик восита. У ҳам фокал (парциал), ҳам иккиламчи генерализацияланган, миоклоник ва генерализацияланган тоник-клоник хуружларда бирдек юқори самарадорлик кўрсатади. Масалан, Карбамазепин миоклоник ёки абсанс хуружларини кучайтириб юбориши мумкин, Эвалеп эса хуружларни кучайтирмайди.", "ar": "Эвалеп — препарат широкого спектра действия. Он высокоэффективен при фокальных (парциальных), генерализованных тонико-клонических и миоклонических приступах (включая юношескую миоклоническую эпилепсию). В отличие от карбамазепина, который может аггравировать (усугублять) абсансы и миоклонии, Эвалеп не вызывает аггравации приступов."}, {"qu": "Эвалепнинг жигар ва ошқозон-ичак тизимига таъсири қандай?", "qr": "Каково влияние Эвалеп на функцию печени и ЖКТ?", "au": "Эвалеп препаратининг 66% қисми буйрак орқали ўзгармаган ҳолда, қолган қисми эса жигар цитохроми иштирокисиз гидролиз йўли билан чиқарилади. Шу боис у жигарни заҳарламайди (гепатотоксик эмас), жигар ферментлари (АЛТ, АСТ) кўтарилишига олиб келмайди ва доимий УТТ ёки жигар пробаларини талаб қилмайди.", "ar": "Около 66% Эвалеп выводится почками в неизмененном виде, остальная часть гидролизуется без участия печеночных ферментов. Препарат не гепатотоксичен, не вызывает повышения трансаминаз (АЛТ, АСТ), панкреатита или желтухи, в отличие от вальпроатов."}, {"qu": "Эвалепнинг когнитив ва седатив ножўя таъсирлари эски антиконвульсантлардан (Фенобарбитал, Бензодиазепинлар) нимаси билан фарқланади?", "qr": "Чем отличаются когнитивные и седативные эффекты Эвалеп от традиционных противосудорожных (Фенобарбитал, Бензодиазепины)?", "au": "Эски авлод препаратлари (айниқса Фенобарбитал) чуқур седация, кундузги уйқучанлик, хотира ва диққатнинг сусайиши, болаларда ўқиш қобилиятининг пасайишига ва қарамликка олиб келади. Эвалеп когнитив функцияларни (хотира, фикрлаш) сақлаб қолади, ўрганиш қобилиятига тўсқинлик қилмайди ва кучли седатив депрессия чақирмайди.", "ar": "Препараты старого поколения (фенобарбитал, примидон, бензодиазепины) вызывают выраженную седацию, сонливость, угнетение психомоторных и когнитивных функций, привыкание и задержку развития у детей. Эвалеп сохраняет когнитивные функции, внимание и работоспособность, не вызывая медикаментозной зависимости."}, {"qu": "Эвалепнинг фертил ёшдаги аёллар ва ҳомиладорликни режалаштиришдаги хавфсизлик даражаси қандай?", "qr": "Каков профиль безопасности Эвалеп у женщин фертильного возраста и при планировании беременности?", "au": "Халқаро репозиторийлар (EURAP) ва клиник тавсияларга кўра, Леветирацетам (Эвалеп) ҳомиладорлик даврида валпроат кислотасига нисбатан сезиларли даражада паст тератоген хавфга (туғма майибликлар хавфи 2-3% атрофида бўлиб, умумий популяция даражасига яқин) эга. Шу сабабли ҳомиладорликни режалаштираётган аёлларда биринчи танлов препаратлари сирасига киради.", "ar": "По данным международных регистров (EURAP), леветирацетам демонстрирует один из самых низких показателей тератогенности среди АЭП (около 2-3%, что сопоставимо с общей популяцией), в то время как вальпроаты несут риск мальформаций до 10% и задержки когнитивного развития плода. Эвалеп является препаратом выбора у женщин репродуктивного возраста."}]}];
const COL=[['#4f46e5','#eef0ff'],['#e11d48','#ffeef2'],['#0891b2','#e6f7fb'],['#7c3aed','#f3edff'],['#d97706','#fff4e1'],['#059669','#e5f8f0'],['#475569','#eef1f5'],['#2563eb','#e8f0ff']];
const $=s=>document.querySelector(s);let cur=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chev='<svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
function sty(i){return `--c:${COL[i][0]};--t:${COL[i][1]}`}
$('#grid').innerHTML=D.map((d,i)=>`<button class="card" style="${sty(i)}" data-i="${i}"><div class="dot">${esc(d.name[0])}</div><b>${esc(d.name)}</b><span>${d.items.length} савол / вопросов</span></button>`).join('');
function qhtml(x,n,i,tag){return `<div class="q" style="${sty(i)}"><button class="qb" aria-expanded="false"><div class="num">${n}</div><div class="qt">${tag?`<span class="tag">${esc(D[i].name)}</span>`:''}<b>${esc(x.qu)}</b><em>${esc(x.qr)}</em></div>${chev}</button><div class="ans"><div class="a"><h4>Ўзбекча</h4>${esc(x.au)}</div><div class="a"><h4>Русский</h4>${esc(x.ar)}</div></div></div>`}
function show(i,scroll){cur=i;$('#s').value='';const d=D[i];
document.querySelectorAll('.card').forEach((c,k)=>c.classList.toggle('on',k===i));
$('#panel').style.cssText=sty(i);
$('#panel').innerHTML=`<div class="phead"><h2><i></i>${esc(d.name)} <small>${d.items.length} савол</small></h2><button class="tog" id="all">Барчасини очиш / Развернуть все</button></div>`+d.items.map((x,k)=>qhtml(x,k+1,i,false)).join('');
if(scroll)$('#panel').scrollIntoView({behavior:'smooth',block:'start'})}
function search(v){document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));cur=null;$('#panel').style.cssText='--c:#4f46e5;--t:#eef0ff';
const t=v.toLowerCase();let out='',n=0;
D.forEach((d,i)=>d.items.forEach((x,k)=>{if((x.qu+' '+x.qr+' '+x.au+' '+x.ar).toLowerCase().includes(t)){n++;out+=qhtml(x,k+1,i,true)}}));
$('#panel').innerHTML=`<div class="phead"><h2>Қидирув натижалари <small>${n}</small></h2></div>`+(out||'<div class="empty">Ҳеч нарса топилмади / Ничего не найдено</div>')}
$('#grid').addEventListener('click',e=>{const b=e.target.closest('.card');if(b)show(+b.dataset.i,true)});
$('#panel').addEventListener('click',e=>{
const qb=e.target.closest('.qb');if(qb){const q=qb.parentElement;const o=q.classList.toggle('open');qb.setAttribute('aria-expanded',o);return}
if(e.target.id==='all'){const qs=[...document.querySelectorAll('#panel .q')];const open=qs.some(q=>!q.classList.contains('open'));
qs.forEach(q=>{q.classList.toggle('open',open);q.querySelector('.qb').setAttribute('aria-expanded',open)});
e.target.textContent=open?'Барчасини ёпиш / Свернуть все':'Барчасини очиш / Развернуть все'}});
$('#s').addEventListener('input',e=>{const v=e.target.value.trim();v?search(v):(cur===null?($('#panel').innerHTML=''):show(cur,false))});
show(0,false);
</script></body></html>
