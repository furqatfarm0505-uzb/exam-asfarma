<style>
:root{--bg:#fff;--ink:#0f172a;--mute:#64748b;--line:#e8ecf2;--soft:#f6f8fb;--acc:#4f46e5;--acc-t:#eef0ff;

.wrap{max-width:1040px;margin:0 auto;padding:48px 20px 80px}
.eyebrow{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);background:var(--acc-t);padding:6px 12px;border-radius:999px}

.search{position:relative;margin-bottom:28px}
.search input{width:100%;font:inherit;font-size:15px;padding:15px 18px 15px 46px;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);outline:none;transition:.15s}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:14px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff;transition:.18s;min-height:118px}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px -12px rgba(15,23,42,.18);border-color:transparent}

.panel{margin-top:36px;scroll-margin-top:16px}

.phead h2{margin:0;font-size:28px;letter-spacing:-.02em;font-weight:800;display:flex;align-items:center;gap:12px}

.qb:focus-visible{outline:3px solid var(--acc-t);outline-offset:-3px}
.num{flex:none;min-width:30px;height:30px;border-radius:9px;background:var(--t);color:var(--c);font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 6px}
.qt{flex:1;min-width:0}
.qt b{display:block;font-weight:600;font-size:15px}
.qt em{display:block;font-style:normal;color:var(--mute);font-size:14px;margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--c);background:var(--t);padding:2px 8px;border-radius:999px;margin-bottom:6px}
.chev{flex:none;width:20px;height:20px;margin-top:5px;stroke:var(--mute);fill:none;stroke-width:2.2;transition:.2s}
.q.open .chev{transform:rotate(180deg)}
.ans{display:none;padding:0 18px 18px 62px}
.q.open .ans{display:block}
.a{border-left:3px solid var(--t);padding:2px 0 2px 14px;margin-top:12px;white-space:pre-line;font-size:14.5px}
.a:first-child{margin-top:0}
.a h4{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);font-weight:700}
.empty{color:var(--mute);text-align:center;padding:40px 0}

та прямой, 3 та непрямой конкурент ёзинг. Ҳар бири учун ишлаш тактикасини ёзиб беринг.", "qr": "Напишите 3 прямых и 3 непрямых конкурента Асформина и тактику работы против каждого из них.", "au": "1. Сиофор, Глюкофаж, Метфогамма. 2. Амарил, Ситаглиптин, Дапаглифлозин. Тўғридан тўғри конкурентларга нисбатан бизнинг нархимиз арзонроқ эканлигини тушунтириш, ёрдамчи модда сифатида МКЦ борлигини айтиш керак, тўғридан-тўғри бўлмаган конкурентга нисбатан уларнинг ножўя таъсирларидан келиб чиқиб, уларнинг камчилиги айтилади.", "ar": "1. Сиофор, Глюкофаж, Метфогамма. 2. Амарил, Ситаглиптин, Дапаглифлозин. Необходимо пояснить, что наши цены ниже, чем у прямых конкурентов, упомянуть наличие МКЦ в качестве вспомогательного вещества, а также указать на их недостатки по сравнению с косвенными конкурентами, исходя из их побочных эффектов."}, {"qu": "ҚД касаллиги симптомларини ёзинг.", "qr": "Напишите симптомы заболевания СД.", "au": "Полидипсия, полиурия, полифагия.", "ar": "Полидипсия, полиурия, полифагия."}, {"qu": "ҚД касаллигининг оғир асоратларини ёзинг.", "qr": "Напишите острые осложнения СД.", "au": "Диабетик кетоацидоз, гипогликемик кома, гиперосмоляр кома, лактоацидемик кома", "ar": "Диабетический кетоацидоз, гипогликемическая кома, гиперосмолярная кома, лактацидотическая кома."}, {"qu": "ИНГЛКТ-2 (SGLT-2) препаратлари ножўя таъсирлари қайсилар?", "qr": "Напишите побочные эффекты препаратов иНГЛТ-2 (SGLT-2).", "au": "Замбуруғли инфекциялар чақиради.", "ar": "Вызывает грибковые инфекции."}, {"qu": "ДПП-4 препаратлари келтириб чиқарадиган ножўя таъсирларни ёзинг.", "qr": "Напишите побочные эффекты препаратов ДПП-4.", "au": "Узоқ вақт давомида ичиб юрилганда ошқозонда ўткир панкреатит чақириши мумкин, доза ошириб юборилганда гипогликемияга олиб келиши мумкин.", "ar": "Длительное применение может вызвать острый панкреатит желудка, а передозировка может привести к гипогликемии."}, {"qu": "Асформин препаратини қўллаш мумкин бўлмаган ҳолатларни ёзинг.", "qr": "Напишите противопоказания к применению препарата Асформин.", "au": "Сурункали буйрак етишмовчилиги 3-босқичдан кейин, СКФ 60 мл/мин дан паст бўлганда, жигар етишмовчилиги — Чайлд Пью бўйича B,C даражада, гипоксия ҳолати кузатилаётган бўлса, алкоголизм (лактоацедемик комага олиб келади), ацидоз, ҳомиладорлик, лактация, ҚД декомпенсация босқичи.", "ar": "Хроническая почечная недостаточность после 3 стадии, когда СКФ менее 60 мл/мин, печеночная недостаточность (класс B, C по Чайлд-Пью), если наблюдается гипоксия, алкоголизм (приводящий к лактацидотической коме), ацидоз, беременность, лактация, стадия декомпенсации сахарного диабета."}, {"qu": "Гликирланган гемоглобин нима?", "qr": "Что такое гликированный гемоглобин?", "au": "Гликирланган гемоглобин бу — глюкозани қоннинг оқсил қисми яъни гемоглобин билан ҳосил қилган бирикмаси ҳисобланади. Бу фоизда ўлчанадиган кўрсаткич бўлиб, глюкозани неча фоиз гемоглобинга бирикканини кўрсатади, норма 4-5,6 %, предиабет — 5,7 — 6,4 %, ҚД — 6,5 % ва ундан юқори бўлиши мумкин.", "ar": "Гликированный гемоглобин представляет собой комбинацию глюкозы и гемоглобина, белкового компонента крови. Это показатель, измеряемый в процентах и показывающий, насколько глюкоза связана с гемоглобином. Норма составляет 4–5,6%, предиабет — 5,7–6,4%, диабет — 6,5% и выше."}, {"qu": "Метаболик синдром критерийларини ёзинг.", "qr": "Напишите критерии метаболического синдрома.", "au": "1. Абдоминал семизлик; 2. ТГ, ЛПВП миқдори; 3. АГ; 4. ИМТ; 5. Қондаги глюкоза миқдори (оч қоринга)", "ar": "1. Абдоминальное ожирение; 2. Уровни ТГ, ЛПВП; 3. АГ; 4. ИМТ; 5. Уровень глюкозы в крови (натощак)"}, {"qu": "Предиабет нима? Нима учун Асформинни предиабетда тавсия қилиш керак?", "qr": "Что такое предиабет? Почему надо рекомендовать Асформин при предиабете.", "au": "Предиабет бу — ҚД критерийларига етиб бормаган бироқ қондаги қанд миқдорини нормадан ошиши билан борадиган углевод алмашинуви бузилишидир.", "ar": "Предиабет — это нарушение углеводного обмена, которое не соответствует критериям диабета, но сопровождается повышением уровня сахара в крови по сравнению с нормой."}, {"qu": "Асформиннинг фармакокинетикаси ва қўлланилиш усуллари, дозалаш тартибини ёзинг.", "qr": "Напишите фармакокинетику, способ применения и режим дозирования Асформина.", "au": "қондаги макс. конц. — 2,5 соат, ярим чиқиш даври — 9-12 соат, қўллаш усули — биринчи ҳафтада 500 мг дан кечқурун бир махалдан бошлаб, иккинчи ҳафтада 500 мг дан 2 махал эрталаб кечқурун овқатдан кейин ёки овқат билан ва 3-хафтадан 850 ва 1000 мг дан кунига 2 махал овқатдан кейин ёки овқат билан қўлланилади.", "ar": "Максимальная концентрация в крови — через 2,5 часа, период полувыведения — 9-12 часов, способ применения — в первую неделю по 500 мг однократно вечером, во вторую неделю по 500 мг 2 раза утром и вечером после еды или во время еды, а с 3-й недели по 850 и 1000 мг 2 раза в день после еды или во время еды."}]}, {"name": "Кардива", "items": [{"qu": "Лиганд нима? Лиганд турларига мисол келтиринг.", "qr": "Что такое лиганд? Приведите примеры типов лигандов.", "au": "Лиганд бу — ҳужайра рецепторига боғланиб уни фаоллаштирадиган ёки блоклайдиган модда ҳисобланади. Лиганд агонист ёки антагонист бўлиши мумкин.", "ar": "Лиганд — это вещество, которое связывается с клеточным рецептором и активирует или блокирует его. Лиганд может быть агонистом или антагонистом."}, {"qu": "Норадреналиннинг вазифаси нима?", "qr": "Какова функция норадреналина?", "au": "Норадреналин альфа ва бета адренорецепторларнинг табиий, кучли агонисти бўлиб у адреналиндан фарқли равишда кўпроқ бета-1 адренорецепторларга кўпроқ таъсир кўрсатади ва барча қон томирларини торайтириб, вазоконстрикция чақиради. Артериал қон босимини оширади.", "ar": "Норадреналин — это естественный, мощный агонист альфа- и бета-адренорецепторов. В отличие от адреналина, он действует больше на бета-1-адренорецепторы и вызывает вазоконстрикцию, сужая все кровеносные сосуды. Повышает артериальное давление."}, {"qu": "Бета-1 ва бета-2 адренорецепторларнинг локализацияларини ёзинг.", "qr": "Запишите локализацию бета-1 и бета-2 адренорецепторов.", "au": "Бета-1 адренорецепторлар локализацияси бўйича кўпроқ юракда ва буйракда жойлашган. Бета-2 адренорецепторлар томирларнинг силлиқ мускулларида, тромбоцитлар, кўз, ёғ тўқималари, ичак, жигар, эндокрин тўқималар, ўпка, бронх, периферик томирлар ва скелет мускулларида жойлашган.", "ar": "Бета-1-адренорецепторы локализуются преимущественно в сердце и почках. Бета-2-адренорецепторы расположены в гладких мышцах сосудов, тромбоцитах, глазах, жировой ткани, кишечнике, печени, эндокринных тканях, легких, бронхах, периферических сосудах и скелетных мышцах."}, {"qu": "Адренорецепторлар турларини ёзинг.", "qr": "Запишите типы адренорецепторов.", "au": "Альфа-1 ва 2; бета-1 ва 2", "ar": "Альфа-1 и 2; бета-1 и 2"}, {"qu": "Бета-блокаторлар турларини ёзинг. 1-,2- ва 3-авлод бета-блокаторларига 2 тадан мисол ёзинг.", "qr": "Запишите типы бета-блокаторов. Напишите по два примера бета-блокаторов 1-го, 2-го и 3-го поколения.", "au": "Бета блокаторлар авлодлари 3 турга бўлинади: 1-авлод носелектив бета-блокаторларга — пропраналол, нодалол, соталол; 2-авлод селектив бета-блокаторларга — бисопролол, атенолол, метапролол; 3-авлод бета-блокаторларга (қўшича вазодилятация хусусиятига эга бўлган) — карведилол, небиволол", "ar": "Бета-адреноблокаторы делятся на 3 поколения: неселективные бета-адреноблокаторы 1-го поколения — пропранолол, нодалол, соталол; селективные бета-адреноблокаторы 2-го поколения — бисопролол, атенолол, метопролол; бета-блокаторы 3-го поколения (с дополнительными вазодилатирующими свойствами) — карведилол, небиволол."}, {"qu": "Нима учун кардиоселектив деб номланади? Селективлилик нима учун абсолют эмас?", "qr": "Почему его называют кардиоселективным? Почему селективность не абсолютна?", "au": "Фақатгина бета-1 адренорецепторларни блоклаганлиги учун ва бета-1 адренорецепторлар асосан юракда жойлашганлиги учун кардиоселектив дейилади. Қачонки селектив бета-блокаторни дозаси ошириб юборилса таъсирининг абсолютлиги йўқолади, яъни селектив бўлса ҳам ҳудди носелектив каби бета-1 ва бета-2 адренорецепторларга таъсир кўрсатади.", "ar": "Он называется кардиоселективным, поскольку блокирует только бета-1-адренорецепторы, а бета-1-адренорецепторы в основном расположены в сердце. При передозировке селективного бета-блокатора его абсолютный эффект теряется, то есть несмотря на селективность, он по-прежнему влияет как на бета-1, так и на бета-2-адренорецепторы, как и неселективный препарат."}, {"qu": "Кардива препарати учун кўрсатмаларни ёзинг.", "qr": "Напишите показания к препарату Кардива.", "au": "АГ, ИБС, ХСН ва ФП", "ar": "АГ, ИБС, ХСН и ФП"}, {"qu": "Кардива препаратини АГ даги таъсир механизмлари қайсилар? Қайси хусусиятлари сабабли АГ да ишлатилади? Қайси дозада, нечи махал қўлланилади?", "qr": "Каковы механизмы действия Кардивы при гипертонии? Благодаря каким свойствам он применяется при АГ? Какую дозу и как часто следует применять?", "au": "Юракда жойлашган бета-1 адренорецепторларни блоклаши ҳисобига юрак қисқаришлар сонини камайтиради, қисқариш кучини камайтиради; буйракда жойлашган бета-1 адренорецепторларни блоклаши ҳисобига ренин ишлаб чиқарилишини блоклайди ва РААС системаси фаоллашмайди, натижада айланиб юрувчи қон ҳажми камаяди ва организмда суюқлик ушлаб қолинмасдан ташқарига чиқарилиши ҳисобига қон босими тушади; альфа-1 блокловчи таъсири ҳисобига периферик қон томирларини кенгайтиради ва периферияда қон айланишини яхшилайди, натижада юракка бўлган босим камаяди ва қон босими тушади. Бундан ташқари эндотелийда азот II оксидини ишлаб чиқарилишини рағбатлантиради. АГ да дозаланиши: бошланғич доза 12,5 мг дан 1 маҳал 2 кун ва 3-кундан бошлаб 25 мг дан 1 маҳал давом эттирилади.", "ar": "Блокируя бета-1-адренорецепторы, расположенные в сердце, он уменьшает частоту сердечных сокращений и снижает их силу; блокируя бета-1-адренорецепторы, расположенные в почках, он блокирует выработку ренина, и система РААС не активируется, что приводит к уменьшению объема циркулирующей крови и снижению артериального давления из-за того, что жидкость выводится из организма вместо того, чтобы задерживаться; благодаря своему эффекту блокатора альфа-1 он расширяет периферические кровеносные сосуды и улучшает циркуляцию крови на периферии, что приводит к снижению нагрузки на сердце и снижению артериального давления. Кроме того, он стимулирует выработку оксида азота II в эндотелии. Дозировка при гипертонии: начальная доза составляет 12,5 мг один раз в день в течение 2 дней, с 3-го дня и далее — 25 мг один раз в день."}, {"qu": "Кардива препаратини ИБС даги таъсир механизмлари қайсилар? Қайси хусусиятлари сабабли ИБС да ишлатилади? Қайси дозада, нечи махал қўлланилади? CAPRICORN тадқиқотини қисқача мазмуни.", "qr": "Каковы механизмы действия препарата Кардива при ИБС? Благодаря каким свойствам он применяется при ИБС? Какую дозу и как часто следует применять? Краткое изложение исследования CAPRICORN.", "au": "ЮИК (юрак ишемик касаллигида) кардиванинг асосан 3 та ҳусусиятини айтиш керак: 1. Антиоксидант ҳусусияти; 2. Азот II оксидини ишлаб чиқаришини рағбатлантириши; 3. Альфа-блокловчи хусусияти. Бу хусусиятлар қуйидаги устунликлар келиб чиқади: карведилол миокарднинг кислородга бўлган эҳтиёжини камайтиради, кардиомиоцитлар апоптозини тўхтатади; силлиқ мускулли ҳужайралар пролиферациясини тўхтатади, эркин радикаллар ҳосил бўлишини тўхтатади; CAPRICORN тадқиқоти 2001-йилда эълон қилинган. Беморлар яқинда инфаркт ўтказган ва чап қоринча дисфункцияси бўлган ФВ <40% дан кам бўлган жами 1959 та бемор қатнашган. Тадқиқот натижасига кўра карведилол қабул қилган гуруҳда келиб чиқиш сабабидан қатъий назар ўлим кўрсаткичи 23% га камайган. Бундан ташқари нефатал инфаркт миокард ривожланиш хавфини 41% га камайтиради.", "ar": "Существует 3 основных свойства Кардивы при лечении ишемической болезни сердца (ИБС): 1. Антиоксидантные свойства; 2. Стимулирует выработку оксида азота II; 3. Альфа-блокирующие свойства. Эти свойства приводят к следующим преимуществам: карведилол снижает потребность миокарда в кислороде и подавляет апоптоз кардиомиоцитов; подавляет пролиферацию гладкомышечных клеток и подавляет образование свободных радикалов; Исследование CAPRICORN было опубликовано в 2001 году. В исследование были включены 1959 пациентов с недавним инфарктом миокарда и дисфункцией левого желудочка с фракцией выброса <40%. По данным исследования, в группе, принимавшей карведилол, наблюдалось снижение смертности на 23% независимо от причины. Кроме того, он снижает риск развития нефатального инфаркта миокарда на 41%."}, {"qu": "Кардива нима хисобига эректил дисфункция чақирмайди?", "qr": "Почему Кардива не вызывает эректильную дисфункцию?", "au": "Карведилол альфа-1 блокловчи таъсири ҳисобига кичик чаноқ бўшлиғидаги қон томирларини кенгайтиради. Кичик чаноқ бўшлиғида қон томирларини кенгайиши ҳисобига қон айланиши яхшиланади ва эркакларда жинсий аъзосига қон оқими яхшиланади ва эректил дисфункцияга олиб келмайди.", "ar": "Карведилол расширяет кровеносные сосуды в полости малого таза за счет своего альфа-1-блокирующего эффекта. За счет расширения сосудов в полости малого таза улучшается кровообращение, а у мужчин улучшается приток крови к половому члену, что не приводит к эректильной дисфункции."}, {"qu": "Кардива буйракни қандай ҳимоя қилади?", "qr": "Как Кардива защищает почки?", "au": "Кардива буйрак артериолаларини кенгайтиради, буйракда қон айланишини яхшилайди, микроальбуминурияни камайтиради, буйрак фильтрациясини яхшилайди, иккиламчи сийдик ҳосил бўлишини кўпайтиради.", "ar": "Кардива расширяет почечные артериолы, улучшает почечный кровоток, снижает микроальбуминурию, улучшает почечную фильтрацию и увеличивает вторичную выработку мочи."}, {"qu": "Кардиванинг небивололдан кўра нима устунликларини биласиз?", "qr": "Какие преимущества имеет Кардива перед небивололом?", "au": "1. Карведилолнинг Небивололдан энг асосий устунлиги альфа-1 блокловчи таъсири борлигида, альфа-1 блокловчи таъсири ҳисобига умумий периферик қон томирлар қаршилигини камайтиради ва СЮЕ да асосий танлов препарат ҳисобланади. 2. Карведилолда 3 хил доза борлиги учун титрлаш қулай. 3. Карведилол ҳам ҳудди небиволол каби эндотелийда азот оксиди синтезини кўпайтиради.", "ar": "1. Главным преимуществом карведилола перед небивололом является то, что он обладает альфа-1-блокирующим эффектом. Благодаря альфа-1-блокирующему эффекту он снижает общее периферическое сосудистое сопротивление и является основным препаратом выбора при СН. 2. Титрование удобно, поскольку карведилол выпускается в трех различных дозировках. 3. Карведилол, как и небиволол, увеличивает синтез оксида азота в эндотелии."}, {"qu": "Нима учун кардива ҚД 2-тип касаллигида танлов препарат ҳисобланади?", "qr": "Почему Кардива является препаратом выбора при СД 2 типа?", "au": "Карведилол инсулинрезистентликни ошириб юбормайди, ундан ташқари 100% жигардан ажралади буйракка зарар келтирмайди. Семизлик ёки ҚД билан азият чекаётган беморлар учун карведилол танлов препарат ҳисобланади.", "ar": "Карведилол не повышает инсулинрезистентность, на 100% выводится печенью и не оказывает вредного воздействия на почки. Карведилол является препаратом выбора для пациентов, страдающих ожирением или диабетом."}, {"qu": "Фракция выброса нима? ФВ нормалари қандай?", "qr": "Что такое фракция выброса? Каковы нормы ФВ?", "au": "ФВ (фракция выброса) — ҳар бир қисқариш пайтида юракдан аортага чиқарилган қоннинг фоизи. Норма 55-70%, 40-55% нормадан паст, <40-юрак етишмовчилиги.", "ar": "Фракция выброса (ФВ) — это процент крови, выбрасываемой из сердца в аорту при каждом сокращении. Норма — 55–70%, ниже нормы — 40–55%, <40 — сердечная недостаточность."}, {"qu": "Кардива препаратининг 5 та непрямой конкурентини ёзинг ва уларга қарши ишлаш тактикасини кўрсатинг.", "qr": "Перечислите 5 непрямых конкурентов препарата Кардива и укажите тактику борьбы с ними.", "au": "Небилет, Бидоп, Эмкор, Бисорол, Эгилок — энг асосий тактика бу — карведилолнинг носелективлиги ва айнан носелективлигидан келиб чиқадиган устунликлари айтилади. Альфа блокловчи таъсир бизнинг энг кучли устунлик тарафимиз.", "ar": "Небилет, Бидоп, Эмкор, Бисорол, Эгилок. Основная тактика: карведилол неселективен, поэтому упоминаются его преимущества, вытекающие из его неселективности. Альфа-блокирующий эффект — наше самое сильное преимущество."}]}, {"name": "Дилютикс", "items": [{"qu": "Гемостаз ҳодисаси нима?", "qr": "Что такое гемостаз?", "au": "Гемостаз — бу, қон томири шикастланганида организмнинг қонни томир ичида ушлаб қолишга, қонни тўхатишга, қонни суюқ ҳолатда ушлаб қолишга ва ўз вазифасини бажариб бўлган тромбоцитларни эришини таъминлашга ёрдам берадиган биологик жараёнлар тизимидир.", "ar": "Гемостаз — это система биологических процессов, которые помогают организму удерживать кровь в сосуде, останавливать кровотечение, поддерживать кровь в жидком состоянии и обеспечивать свертывание тромбоцитов, выполнивших свою функцию при повреждении кровеносного сосуда."}, {"qu": "Адгезия, активация ва агрегация тушунчалари тўғрисида нималар биласиз?", "qr": "Что вы знаете о понятиях адгезии, активации и агрегации?", "au": "Агар тромбоцитар тромб ҳосил бўлиши жараёнини оладиган бўлсак, адгезия бу тромбоцитнинг эндотелийга ёпишиши, активация — бу тромбоцитларнинг фаоллашиши ва агрегация тромбоцитларнинг бир-бирига ёпишиб тромб ҳосил бўлиш жараёнидир.", "ar": "Если рассматривать процесс образования тромбоцитарного тромба, то адгезия — это прилипание тромбоцитов к эндотелию, активация — это активация тромбоцитов, а агрегация — это процесс склеивания тромбоцитов с образованием тромба."}, {"qu": "Антиагрегантлар ва антикоагулянтларни фарқи нима?", "qr": "В чем разница между антиагрегантами и антикоагулянтами?", "au": "Антиагрегантлар ва антикоагулянтларнинг вазифаси бир хил. Иккаласи ҳам қонни суюлтиради, лекин, турли хил механизмда. Антиагрегантлар тромбоцитлар агрегациясини блоклаб, тромбоцитар тромб ҳосил бўлишини тўхтатади, антикоагулянтлар бўлса, қон ивишини таъминловчи факторларни блоклайди, факторлар блокланиши натижасида протромбиндан тромбин, фибриногендан фибрин синтезланиши тўхтайди.", "ar": "Антиагреганты и антикоагулянты имеют одинаковую функцию. Оба разжижают кровь, но механизмы их действия различны. Антиагреганты блокируют агрегацию тромбоцитов и прекращают образование тромбоцитарных тромбов, а антикоагулянты блокируют факторы, обеспечивающие свертываемость крови. В результате блокирования факторов прекращается синтез тромбина из протромбина и фибрина из фибриногена."}, {"qu": "Тромбоксан А2 ҳосил бўлиши натижасида қандай ҳолат пайдо бўлади?", "qr": "Какое состояние возникает в результате образования тромбоксана А2?", "au": "Тромбоксан А2 ҳам ҳудди АДФ каби таъсир кўрсатади ва уларнинг тромбоцит юзасидаги рецепторларга боғланиши, тромбоцитларнинг фаоллашишига олиб келади. Тромбоцит фаоллашса, тромбоцит юзасида GP IIb/IIIa рецепторлари фаоллашади ва бу рецепторлар фибриногенлар билан боғланади ва бир қанча тромбоцитларнинг айнан GP IIb/IIIa рецепторлари фибриноген билан боғланиши тромб ҳосил бўлишига олиб келади.", "ar": "Тромбоксан А2 действует аналогично АДФ, и его связывание с рецепторами на поверхности тромбоцитов приводит к активации тромбоцитов. При активации тромбоцита активируются рецепторы GP IIb/IIIa на его поверхности, которые связываются с фибриногеном, а связывание рецепторов GP IIb/IIIa нескольких тромбоцитов с фибриногеном приводит к образованию тромба."}, {"qu": "Қачон GPIIb/IIIа фаоллашади?", "qr": "Когда активируется GP IIb/IIIa?", "au": "Тромбоцит фаоллашса, тромбоцит юзасида GP IIb/IIIa рецепторлари фаоллашади ва бу рецепторлар фибриногенлар билан боғланади ва бир қанча тромбоцитларнинг айнан GP IIb/IIIa рецепторлари фибриноген билан боғланиши тромб ҳосил бўлишига олиб келади.", "ar": "При активации тромбоцита активируются рецепторы GP IIb/IIIa на его поверхности, которые связываются с фибриногеном, а связывание рецепторов GP IIb/IIIa нескольких тромбоцитов с фибриногеном приводит к образованию тромба."}, {"qu": "P2Y12 рецепторлари блокаторларига мисоллар келтиринг.", "qr": "Приведите примеры блокаторов рецепторов P2Y12.", "au": "Клопидогрел, типлопидин, просугрел, тикагрелор", "ar": "Клопидогрел, тиклопидин, прасугрел, тикагрелор."}, {"qu": "АСК таъсир механизмини ёзинг.", "qr": "Опишите механизм действия АСК.", "au": "АСК нинг қон суюлтирувчи механизми ферментатив йўлни блоклаши билан боғлиқ, яъни, АСК ЦОГ-1 (циклооксигеназа-1) ферментини ингибирлайди, натижада тромбоксан А2 ҳосил бўлиш реакциялар занжири узилади ва тромбоксан А2 синтезланмайди.", "ar": "Механизм разжижения крови АСК связан с блокированием ферментативного пути, то есть АСК ингибирует фермент ЦОГ-1 (циклооксигеназу-1), в результате чего цепь реакций образования тромбоксана А2 прерывается и тромбоксан А2 не синтезируется."}, {"qu": "Дилютикснинг таъсир механизмини ёзинг.", "qr": "Напишите механизм действия Дилютикса.", "au": "Дилютикс (клопидогрел) — тромбоцитлар юзасида жойлашган АДФ-рецепторлари (P2Y12) ни блоклайди ва тромбоцитларга АДФ бирикиб GP IIb/IIIa комплекси фаоллашишини ва натижада тромбоцитлар бир бирига боғланиб, агрегацияланишини тўхтатади ва тромбоцитар тромб ҳосил бўлишини олдини олади.", "ar": "Дилютикс (клопидогрел) блокирует рецепторы АДФ (P2Y12), расположенные на поверхности тромбоцитов, и препятствует связыванию АДФ с тромбоцитами, активируя комплекс GP IIb/IIIa, в результате чего тромбоциты связываются друг с другом и агрегируют, предотвращая образование тромбоцитарных тромбов."}, {"qu": "Дилютикснинг кўрсатмаларини ёзинг.", "qr": "Напишите показания к применению Дилютикса.", "au": "Миокард инфаркти (бир неча кундан 35 кунгача), ишемик инсульт (7 кундан кўп, 6 ойдан кам) ёки ташхис қилинган периферик артерия касалликлари бўлган беморларда атеростромботик ҳодисаларнинг олдини олиш;\nЎткир коронар синдроми билан оғриган беморларда:\n– SТ сегментини кўтармаган ўткир коронар синдроми (барқарор бўлмаган стенокардия ёки миокард инфаркти Q тишсиз), шу жумладан трансдермал коронар аралашувга дучор бўлган беморлар, АKШ, стентлаш;\n- SТ сегментининг кўтарилиши билан боғлиқ бўлган ўткир миокард инфаркти, тромболитик терапия қўлланилиши мумкин бўлган дори билан даволанаётган беморларда;\nКлопидогрел, юрак-қон томир хасталиклари хавфи юқори бўлган мерцател аритмия (МА) билан оғриган беморларда, юрак-қон томир хасталиклари билан боғлиқ атеростромботик ва тромбоемболик асоратларнинг олдини олиш учун катта ёшли беморларда қўлланилади.", "ar": "Профилактика атеротромботических событий у пациентов, перенесших инфаркт миокарда (от нескольких дней до менее чем 35 дней), ишемический инсульт (от 7 дней до менее чем 6 месяцев) или имеющих диагностированные заболевания периферических артерий;\nпациентов, страдающих острым коронарным синдромом:\n– острый коронарный синдром без подъема сегмента ST (нестабильная стенокардия или инфаркт миокарда без зубца Q), в том числе пациенты, подлежащие чрескожному коронарному вмешательству, АКШ, стентирование;\n– острый инфаркт миокарда с подъемом сегмента ST, у пациентов, получающих медикаментозное лечение с возможным применением тромболитической терапии.\nКлопидогрел показан к применению взрослым пациентам для предупреждения атеротромботических и тромбоэмболических осложнений при мерцательной аритмии. У пациентов с мерцательной аритмией (МА) с повышенным риском сердечно-сосудистых осложнений."}, {"qu": "Дилютикснинг АСК дан устунликларини ёзинг.", "qr": "Напишите преимущества Дилютикса по сравнению с АСК.", "au": "ДИЛЮТИКС (КЛОПИДОГРЕЛ) ТРОМБОЦИТЛАР ЮЗАСИДА ЖОЙЛАШГАН АДФ РЕЦЕПТОРЛАРИНИ БЛОКЛАБ, АДФНИ ТРОМБОЦИТЛАР ЮЗАСИГА БОҒЛАНИШИНИ БЛОКЛАЙДИ. НАТИЖАДА ТРОМБОЦИТЛАР АГРЕГАЦИЯЛАНМАЙДИ. ТРОМБ ҲОСИЛ БЎЛМАЙДИ. ДИЛЮТИКС ТРОМБОЦИТЛАР АКТИВАЦИЯСИНИ АНЧА ОЛДИНРОҚ ЗВЕНОСИГА ТАЪСИР ҚИЛАДИ (РЕЦЕПТОРГА). АДФ РЕЦЕПТОРЛАРИНИ БЛОКЛАГАНЛИГИ УЧУН АСК ГА НИСБАТАН САМАРАЛИРОҚ ТАЪСИР КЎРСАТАДИ. АСК ЦОГ-1 НИ БЛОКЛАБ ТРОМБОКСАН А2 НИ СИНТЕЗ БЎЛИШИНИ ТЎХТАТАДИ. ЦОГ-1 БЛОКЛАНИШИ ҲИСОБИГА ОШҚОЗОНДА ЯЛЛИҒЛАНИШНИ КЕЛТИРИБ ЧИҚАРАДИ. ДИЛЮТИКС УЗОҚ МУДДАТ ҚАБУЛ ҚИЛИНГАНИДА ҲАМ ОШҚОЗОН ИЧАК ТРАКТИДАН ҚОН КЕТИШ ҲАВФИНИ ОШИРИБ ЮБОРМАЙДИ.", "ar": "Дилютикс (клопидогрел) блокирует рецепторы АДФ, расположенные на поверхности тромбоцитов, предотвращая связывание АДФ с поверхностью тромбоцитов. В результате тромбоциты не агрегируют. Тромбообразования не будет. Дилютикс воздействует на более раннюю стадию активации тромбоцитов (рецептор). Он более эффективен, чем АСК, поскольку блокирует рецепторы АДФ. Аспирин блокирует ЦОГ-1, предотвращая синтез тромбоксана А2. Он вызывает воспаление в желудке, блокируя ЦОГ-1. Дилютикс не увеличивает риск желудочно-кишечного кровотечения даже при длительном приеме."}, {"qu": "Дилютикснинг фармакокинетикасини ёзинг.", "qr": "Напишите фармакокинетику Дилютикса.", "au": "Перорал қабул қилингандан сўнг овқат ҳазм қилиш трактидан тезда сўрилади;\nБиофаоллик антацидлар ва озиқ-овқат қабул қилинишига боғлиқ эмас,\nЯрим ажралиш вақти — 8 соат;\nИкки хил йўл билан, буйраклар (50%) ва ошқозон-ичак тракти (50%) билан ажралади.", "ar": "После приема внутрь быстро всасывается из пищеварительного тракта;\nбиодоступность не зависит от приема антацидов и пищи;\nпериод полувыведения составляет 8 часов;\nвыводится двумя путями: почками (50%) и желудочно-кишечным трактом (50%)."}, {"qu": "Дилютикснинг 3 та непрямой конкурентини ёзинг. Уларга қарши ишлаш тактикасини кўрсатинг.", "qr": "Напишите 3 непрямых конкурента Дилютикса.", "au": "АСК, ривароксабан, апиксабан, гепарин, эноксапарин.", "ar": "АСК, ривароксабан, апиксабан, гепарин, эноксапарин."}, {"qu": "Дилютикснинг 10 та прямой конкурентини ёзинг. Прямой конкурентлардан нима афзалликлари бор?", "qr": "Перечислите 10 прямых конкурентов Дилютикса. Какие преимущества он имеет перед прямыми конкурентами?", "au": "Плавикс, Зилт, Клопивин, Клопидогрел (Радикс), Клопицин, Инстаклоп, Стазекс, Плогрель, Клевикс Ультра, Карум Сановель, Антагрикс, Плагрил. Дилютикс тўғридан-тўғри конкурентларни кўпчилигидан асосан нарҳи бўйича устунлик қилади, европа сифатидаги, нархи арзонроқ бўлган антиагрегант. Бундан ташқари, Дилютиксни оригинали (Плавикс) билан биоэквивалентлиги Ўзбекистонда текширилган ва биоэквивалентлиги 99,5 % деб ҳулоса берилган текширув натижалари бор.", "ar": "Плавикс, Зилт, Клопивин, Клопидогрел (Радикс), Клопицин, Инстаклоп, Стазекс, Плогрель, Клевикс Ультра, Карум Сановель, Антагрикс, Плагрил. Дилютикс имеет преимущество перед большинством своих прямых конкурентов, прежде всего в цене, являясь недорогим антиагрегантным средством европейского качества. Кроме того, имеются результаты испытаний, которые показывают, что биоэквивалентность Дилютикса с оригиналом (Плавиксом) была проверена в Узбекистане и что биоэквивалентность составила 99,5%."}, {"qu": "Дилютикс учун 3 та FAB ёзинг.", "qr": "Напишите 3 FAB для Дилютикса.", "au": "1. ДИЛЮТИКС (КЛОПИДОГРЕЛ) ТРОМБОЦИТЛАР ЮЗАСИДА ЖОЙЛАШГАН АДФ РЕЦЕПТОРЛАРИНИ БЛОКЛАБ, АДФНИ ТРОМБОЦИТЛАР ЮЗАСИГА БОҒЛАНИШИНИ БЛОКЛАЙДИ. НАТИЖАДА ТРОМБОЦИТЛАР АГРЕГАЦИЯЛАНМАЙДИ. ТРОМБ ҲОСИЛ БЎЛМАЙДИ. ДИЛЮТИКС ТРОМБОЦИТЛАР АКТИВАЦИЯСИНИ АНЧА ОЛДИНРОҚ ЗВЕНОСИГА ТАЪСИР ҚИЛАДИ (РЕЦЕПТОРГА). 2. ДИЛЮТИКС 50% БУЙРАКДАН, 50% ОШҚОЗОН ИЧАК ТРАКТИДАН АЖРАТИЛАДИ. РЕЗИСТЕНТЛИК ЧАҚИРМАЙДИ. АСК ТЎЛИҚ БУЙРАКДАН АЖРАТИЛАДИ. БУЙРАК КАСАЛЛИГИ БОР БЕМОРЛАРДА ДИЛЮТИКСНИ ҚЎЛЛАШ ХАВФСИЗРОҚ БЎЛАДИ. КЎПЛАБ БЕМОРЛАРДА АСКГА НИСБАТАН РЕЗИСТЕНТЛИК РИВОЖЛАНАДИ. 3. ДИЛЮТИКСНИ АФФИНЛИГИ БОШҚА ҚОН СУЮЛТИРУВЧИ ПРЕПАРАТЛАР, МАСАЛАН РИВАРОКСАБАНДАН КЎРА ТРОМБОЦИТЛАРГА ЎЗАРО БОҒЛИҚЛИГИ ЮҚОРИ, ШУНИНГ УЧУН ҲАМ САМАРАЛИРОҚ ТАЪСИР КЎРСАТАДИ.", "ar": "1. Дилютикс (клопидогрел) блокирует рецепторы АДФ, расположенные на поверхности тромбоцитов, блокируя связывание АДФ с поверхностью тромбоцитов. В результате тромбоциты не агрегируют. Тромбообразования не будет. Дилютикс воздействует на более раннюю стадию активации тромбоцитов (рецептор). 2. Дилютикс выводится на 50% почками и на 50% через желудочно-кишечный тракт. Резистентность не вызывает. АСК полностью выводится почками. Дилютикс безопаснее использовать у пациентов с заболеваниями почек. У многих пациентов развивается резистентность к АСК. 3. Дилютикс имеет более высокое сродство к тромбоцитам, чем другие разжижители крови, такие как ривароксабан, и поэтому более эффективен."}, {"qu": "Клопидогрел + АСК ишлатадиган врачларга қайси тактикада иш олиб борасиз?", "qr": "Какую тактику вы используете в отношении врачей, использующих клопидогрел + АСК?", "au": "Бу ҳозирги кундаги жуда кўп қўлланиладиган усул ҳисобланади, лекин ўзига яраша камчилиги бор. Масалан, қайсидир таъсир қилувчи моддага нисбатан организмда резистентлик бўлиши мумкин, ундан ташқари гастропатик ножўя таъсирларни кўпроқ юзага чиқишига сабаб бўлиши мумкин, ва қон кетиш хаввфини ошириб юборади, нарх жихатдан ҳам жуда ноқулай ҳисобланади.", "ar": "Сегодня это очень распространенный метод, но у него есть свои недостатки. Например, организм может выработать устойчивость к определенному активному ингредиенту, что может привести к усилению побочных эффектов со стороны желудочно-кишечного тракта, повышению риска кровотечения, а также он весьма дорогостоящ."}, {"qu": "Просугрел, тикагрелор ишлатадиган врачларга қайси тактикада иш олиб борасиз?", "qr": "Какую тактику вы используете в отношении врачей, использующих прасугрел и тикагрелор?", "au": "АКШ, стентлаш амалиётидан кейин бугунги кунда энг кўп прасугрел ёки тикагрелор берилади, кимлардир 3 ойга, кимлардир эса 6 ёки 12 ойга мослаб бериши мумкин. Бу янги турдаги АДФ рецепторларининг кучли блокаторларининг ҳам ножўя таъсирлари кўп. Ўтказилган клиник тадқиқотлар натижасига кўра, АДФ рецепторларининг кучли блокаторлари (прасугрел, тикагрелор) айнан клопидогрелга солиштирилганда кўпроқ хансираш чақирган ва кўпчиликда қон кетиш хавфи ортиб кетган ва айнан шунинг учун ҳам беморлар даволаш курси давомидан АДФ рецепторларининг кучли блокаторлари (прасугрел, тикагрелор)ни тўхтатиб бошқа гуруҳ дори воситалари қабул қилишга ўтишган. Шу тактика бўйича врачга маълумот беринг.", "ar": "После стентирования и АКШ сегодня чаще всего назначают прасугрел или тикагрелор: одним пациентам на 3 месяца, другим — на 6 или 12 месяцев. Эти новые типы мощных блокаторов рецепторов АДФ также имеют множество побочных эффектов. По результатам клинических исследований, сильные блокаторы рецепторов АДФ (прасугрел, тикагрелор) вызывали более выраженную одышку, чем клопидогрел, и увеличивали риск кровотечения у многих людей, поэтому пациенты прекращали прием сильных блокаторов рецепторов АДФ (прасугрел, тикагрелор) в ходе лечения и переходили на другие группы препаратов. Сообщите своему врачу об этой тактике."}, {"qu": "АСК ишлатадиган врачларга қайси тактикада иш олиб борасиз?", "qr": "Какую тактику вы используете в отношении врачей, применяющих АСК?", "au": "АСК нинг қон суюлтирувчи механизми ферментатив йўлни блоклаши билан боғлиқ, яъни, АСК ЦОГ-1 (циклооксигеназа-1) ферментини ингибирлайди, натижада тромбоксан А2 ҳосил бўлиш реакциялар занжири узилади ва тромбоксан А2 синтезланмайди. АСК механизмидан келиб чиқиб энг кўпроқ ошқозонга зарар келтиради, гастропатик ножўя таъсирлар келтириб чиқаради. Ўтказилган тадқиқотлар натижаларига кўра, АСК қабул қилган кўплаб беморларда резистентлик ривожланган ва бошқа препаратга ўтишга мажбур бўлган. Бундан ташқари АСК узоқ муддатда катта дозада қабул қилинганида қулоқда шовқин, кучли бош оғриғи келиб чиқишига сабаб бўлиши мумкин.", "ar": "Механизм разжижения крови АСК связан с блокированием ферментативного пути, то есть АСК ингибирует фермент ЦОГ-1 (циклооксигеназу-1), в результате чего цепь реакций образования тромбоксана А2 прерывается и тромбоксан А2 не синтезируется. Исходя из механизма действия, АСК с наибольшей вероятностью может вызвать повреждение желудка, вызывая гастропатические побочные эффекты. По результатам исследований, у многих пациентов, принимавших АСК, развилась резистентность, и они были вынуждены перейти на другой препарат. Кроме того, АСК при длительном приеме в больших дозах может вызвать шум в ушах и сильные головные боли."}]}, {"name": "Дорепам", "items": [{"qu": "Депрессия нима?", "qr": "Что такое депрессия?", "au": "Депрессия — ўзини, ўз ҳолатини ва ўз келажагини салбий пессимист баҳолаш, интеллектуал ва мотор фаолиятининг тормозланиши, ҳаракатларнинг пасайиши ва сомато — вегетатив бузилишлар билан тавсифланадиган, патологик кайфият тушиши (гипотемия) билан тавсифланадиган руҳий бузилиш.", "ar": "Депрессия — психическое расстройство, характеризующееся патологически сниженным настроением (гипотимией) с негативной пессимистической оценкой самого себя, своего положения и своего будущего, торможением интеллектуальной и моторной деятельности, снижением побуждений и соматовегетативными нарушениями."}, {"qu": "Депрессия келиб чиқишининг асосий механизми. Моноамин теорияси.", "qr": "Основной механизм депрессии. Моноаминовая теория.", "au": "Нейромедиатор тизимларининг функционал етишмовчилиги:\nНейромедиатор тизимлари бир-бири билан чамбарчас боғлиқ бўлгани учун, баъзиларидаги ўзгаришлар бошқаларнинг ўзгаришига олиб келади.\n1. Сератонин\n2. Норадреналин\n3. Дофамин", "ar": "Функциональный дефицит нейромедиаторных систем:\nТак как нейромедиаторные системы тесно связаны друг с другом, изменения в одних приводят к изменению в других.\n1. серотониновой;\n2. норадреналиновой;\n3. дофаминовой."}, {"qu": "Депрессияга ташхис қўйиш учун қайси усуллардан фойдаланилади? Қайси шкала турларини биласиз?", "qr": "Какие методы используются для диагностики депрессии? Какие шкалы вы знаете?", "au": "Депрессияга ташхис қўйиш учун асосан сўровнома усулларидан фойдаланилади. Асосий ва қўшимча симптоматик белгиларига қараб ташхис қўйилади. Бизда кўпроқ Бека шкаласидан фойдаланилади. Лекин дунё стандартларида DSM-5 шкаласидан ҳам фойдаланилади.", "ar": "Для диагностики депрессии в основном используются методы анкетирования. Диагноз ставится на основании основных и дополнительных симптомов. Мы чаще используем шкалу Бека. Однако шкала DSM-5 используется и в мировых стандартах."}, {"qu": "Депрессия аффектив бузилиш типлари бўйича қандай турларга бўлинади?", "qr": "Какие типы аффективных расстройств существуют при депрессии?", "au": "монополяр, биполяр бузилишлар", "ar": "Монополярное и биполярное расстройства."}, {"qu": "Монополяр депрессия турларига 3 та мисол келтиринг.", "qr": "Приведите 3 примера типов монополярной депрессии.", "au": "депрессив эпизод, рекуррент депрессия, дистимия", "ar": "депрессивный эпизод, рекуррентная депрессия, дистимия."}, {"qu": "Биполяр депрессия 1-тип бўйича тушунчангизни ёзинг.", "qr": "Напишите свое определение биполярной депрессии 1-го типа.", "au": "Бу биполяр депрессия тури бўлиб, илгари манийлик, депрессив психоз деб номланган ва униполяр депрессияга қараганда камроқ учрайди. У депрессив ҳолатлар, нормал ҳолатлар ва мания ҳолатларидан иборат бўлади. Мания фазалари ҳаддан ташқари юқори кайфият, гиперактивлик, хавотир ва уйқусизлик билан боғлиқ. Мания фикрлаш, хулқ-атвор ва ижтимоий хатти-ҳаракатларга таъсир қилади, жиддий муаммо ва қийинчиликларни келтириб чиқаради. Инсон мания ҳолатда бўлганида, у тез-тез ва ножўя жинсий алоқада бўлади, ақлли бўлмаган молиявий қарорлар қабул қилади. Мания эпизодидан сўнг бундай одамлар кўпинча депрессияга тушишади. Ушбу ҳис-туйғулар тўқнашувини тасвирлашнинг энг яхши усули — \"дунёнинг тепасида бўлиш ва умидсизликнинг тубларига тушиш\"дир. Биполяр бузилишдаги депрессия аломатлари баъзан униполар депрессиядан ажратиш қийин бўлади.", "ar": "Это тип биполярной депрессии, ранее называвшийся маниакально-депрессивным психозом, и он встречается реже, чем униполярная депрессия. Он состоит из депрессивных состояний, нормальных состояний и маниакальных состояний. Маниакальные фазы сопровождаются крайне приподнятым настроением, гиперактивностью, тревогой и бессонницей. Мания влияет на мышление, поведение и социальные взаимодействия, вызывая серьезные проблемы и трудности. Когда человек находится в маниакальном состоянии, он вступает в частые и неуместные половые связи и принимает неразумные финансовые решения. После маниакального эпизода такие люди часто впадают в депрессию. Лучший способ описать это столкновение эмоций — «быть на вершине мира и падать в пучину отчаяния». Симптомы депрессии при биполярном расстройстве иногда трудно отличить от симптомов униполярной депрессии."}, {"qu": "Биполяр депрессия 2-тип бўйича тушунчангизни ёзинг.", "qr": "Напишите свое определение биполярной депрессии 2-го типа.", "au": "Бу кўпроқ биполяр бузилишдан кўра, рекуррент депрессияга ўхшайди. Бу касалликда кўп депрессив фазалар мания фазалари билан бир-бирига алмашади, лекин камроқ эйфория билан. Бу даврларда, оила аъзолари ва яқинлари нотўғри хулосага келиши мумкин, яъни бу одамнинг аҳволи яхши деб ўйлашади.", "ar": "Это больше похоже на рецидивирующую депрессию, чем на биполярное расстройство. При этом заболевании многие депрессивные фазы чередуются с маниакальными, но с меньшей эйфорией. В это время члены семьи и близкие могут прийти к неверному выводу, думая, что у человека все хорошо."}, {"qu": "Катта депрессия касаллиги бўйича тушунчангизни ёзинг.", "qr": "Напишите свое определение большого депрессивного расстройства.", "au": "Депрессив эпизоднинг такрорланиши — бу, одатда ўсмирлик ёки балоғат даврида бошланадиган, такрорланувчи депрессив ҳасталик ёки катта депрессив хасталикдир. Ушбу турдаги депрессияда бир неча ойдан бир неча йилгача давом этадиган депрессия босқичлари нормал кайфият босқичлари билан алмаштирилади. Депрессиянинг бу тури иш қобилиятига жиддий таъсир кўрсатиши мумкин ва ўз табиати бўйича бир қутбли бўлади (мания ёки гипомания фазаси йўқ). Бу \"классик\" ёки \"клиник\" депрессия деб ҳам аталади.", "ar": "Рекуррентный депрессивный эпизод — это рецидивирующее депрессивное расстройство или большое депрессивное расстройство, которое обычно начинается в подростковом или взрослом возрасте. При этом типе депрессии периоды депрессии продолжительностью от нескольких месяцев до нескольких лет чередуются с периодами нормального настроения. Этот тип депрессии может серьезно влиять на трудоспособность и имеет униполярный характер (без маниакальных или гипоманиакальных фаз). Это также называется «классической» или «клинической» депрессией."}, {"qu": "Агорофобия нима?", "qr": "Что такое агорафобия?", "au": "—", "ar": "—"}, {"qu": "Дорепамнинг таъсир механизмини ёзинг.", "qr": "Напишите механизм действия Дорепама.", "au": "Сератонинни қайта қамраб олишини ингибирлайди. (давомини тўлиқроқ ўзингиз ёритиб беринг)", "ar": "Ингибирует обратный захват серотонина. (пожалуйста, расскажите подробнее)"}, {"qu": "Дорепамнинг кўрсатмаларини ёзинг.", "qr": "Напишите показания к применению Дорепама.", "au": "ҳар қандай оғирлик даражасидаги депрессия турлари; паник бузилишлар — агорафобия ёки а-фобиясиз; социал-вахима бузилишлар; генерелазицияланган ваҳима бузилиши; обсессив компулсив бузилишлар", "ar": "депрессивные эпизоды любой степени тяжести;\nпанические расстройства с/без агорафобии;\nсоциальное тревожное расстройство (социальная фобия);\nгенерализованное тревожное расстройство;\nобсессивно-компульсивное расстройство."}, {"qu": "Трициклик антидепрессантга мисол келтиринг. Ножўя таъсирини ёзинг.", "qr": "Приведите пример трициклического антидепрессанта. Запишите побочные эффекты.", "au": "Амиртриптиллин, кломипрамин, доксепин. Асосан холинолитик ножўя таъсирлар келтириб чиқариши мумкин (давомини ёзинг).", "ar": "Амитриптилин, кломипрамин, доксепин. В основном могут вызывать холинолитические побочные эффекты (напишите подробнее)."}, {"qu": "СИОЗСиН га 3 та мисол ёзинг. Уларнинг таъсир механизми қандай?", "qr": "Напишите 3 примера СИОЗСН. Каков механизм их действия?", "au": "Венлафаксин, Дулоксетин, Милнаципрам. Сератонин ва норадреналинни селектив ингибирловчи антидепрессантлар.", "ar": "Венлафаксин, Дулоксетин, Милнаципран. Антидепрессанты, которые селективно ингибируют серотонин и норадреналин."}, {"qu": "Холинолитик ножўя таъсирлар қайси рецепторларга таъсир кўрсатиш натижасида пайдо бўлади?", "qr": "В результате воздействия на какие рецепторы возникают холинергические побочные эффекты?", "au": "Асосан гистамин, мускарин рецепторларга таъсир натижасида пайдо бўлади. Масалан, трициклик антидепрессант амитриптиллин H1 гистамин ва мускарин рецепторларига таъсир кўрсатиши натижасида бўшаштиради, уйқу чақиради, ва альфа ва бета рецепторларига таъсир кўрсатиши натижасида периферик қон томирларини торайтириши мумкин ва буни натижасида тахикардия чақириши мумкин.", "ar": "В основном это обусловлено воздействием на гистаминовые и мускариновые рецепторы. Например, трициклический антидепрессант амитриптилин воздействует на гистаминовые H1-рецепторы и мускариновые рецепторы, расслабляя и вызывая сон, а также воздействует на альфа- и бета-рецепторы, сужая периферические кровеносные сосуды, что может вызвать тахикардию."}, {"qu": "Дорепам (эсциталопрамнинг)нинг ўзига хосликларини айтинг.", "qr": "Опишите особенности препарата Дорепам (эсциталопрам).", "au": "1. Баланслашган антидепрессант. 2. ЮҚС (ЧСС), ЭКГ ва АГ га таъсир кўрсатмайди. 3. Икки хил таъсир механизмига эга. 4. Эпилепсияда қўллаш мумкин. 5. Циталопрамнинг S-энантомери ҳисобланади ва R-энантомерга нисбатан 100 марта кучли ингибирловчи таъсир кўрсатади.", "ar": "1. Сбалансированный антидепрессант. 2. Не влияет на ЧСС, ЭКГ и АГ. 3. Имеет два различных механизма действия. 4. Можно применять при эпилепсии. 5. Это S-энантиомер циталопрама, обладающий в 100 раз более сильным ингибирующим эффектом, чем R-энантиомер."}, {"qu": "Социал фобия нима?", "qr": "Что такое социальная фобия?", "au": "Ижтимоий-вахима бузилиши муайян ижтимоий ёки иш вазиятлари ҳақида қўрқув ва ваҳима билан тавсифланади. Улар бундай вазиятлардан қочишади ёки ўша вазиятни ортиқча ваҳима билан ўтказишади.", "ar": "Социальное тревожное расстройство характеризуется страхом и тревогой по поводу определенных социальных или рабочих ситуаций. Они избегают таких ситуаций или переживают их с чрезмерным страхом."}, {"qu": "Психиатр қайси касалликларни даволайди?", "qr": "Какие заболевания лечит психиатр?", "au": "Катта депрессив бузилиш, ижтимоий вахима бузилиши, генерализацияланган вахима бузилиши, обсесив-компульсив бузилишлар, агорафобиялар ва бошқалар", "ar": "Большое депрессивное расстройство, социальное тревожное расстройство, генерализованное тревожное расстройство, обсессивно-компульсивное расстройство, агорафобия и т. д."}, {"qu": "Қайси касалликларда Дорепам 20 мг тавсия қилиш керак?", "qr": "При каких заболеваниях следует назначать Дорепам 20 мг?", "au": "Катта депрессив бузилиш, ижтимоий вахима бузилиши, генерализацияланган вахима бузилиши, обсесив-компульсив бузилишлар, агорафобиялар ва бошқалар", "ar": "Большое депрессивное расстройство, социальное тревожное расстройство, генерализованное тревожное расстройство, обсессивно-компульсивное расстройство, агорафобия и т. д."}, {"qu": "Дорепам учун 3 та непрямой конкурент ва уларга қарши ишлаш тактикасини ёзинг.", "qr": "Назовите трех косвенных конкурентов Дорепама и тактику борьбы с ними.", "au": "Флуоксетин, пароксетин, тразадон, миртазапин, амитриптиллин. Буларнинг асосий ножўя таъсиридан келиб чиққан ҳолатда бу препаратларга қарши иш юритамиз.", "ar": "Флуоксетин, Пароксетин, Тразодон, Миртазапин, Амитриптилин. Мы работаем с этими препаратами в случае возникновения их основных побочных эффектов."}, {"qu": "Дорепам кардиологияда қандай ишлатилади? Қандай титрланади?", "qr": "Как Дорепам применяется в кардиологии? Как его титруют?", "au": "Кардиологик касалликларнинг жуда кўпчилигида депрессия учрайди. Масалан сурункали юрак етишмовчилиги, ЮИК, АГ ёки инфаркт ўтказган беморларда жуда кўпчилигида депрессия учрайди. Кардиологларнинг 90%и хавфсиз яъни АГ, ЭКГ, ЧСС га таъсир қилмайдиган антидепрессант хохлайдилар. Айнан шу тарафдан эсциталопрамни кардиологияда тавсия қилган афзал деб тушунтирилади.", "ar": "Депрессия является частым явлением при многих сердечно-сосудистых заболеваниях. Например, депрессия очень распространена у пациентов с хронической сердечной недостаточностью, ишемической болезнью сердца, гипертонией или перенесших сердечный приступ. 90% кардиологов хотят иметь безопасный антидепрессант, то есть не влияющий на АГ, ЭКГ и ЧСС. Вот почему эсциталопрам рекомендуется в кардиологии."}]}, {"name": "Пасивалем", "items": [{"qu": "Пасивалем таркибини тўлиқ дозалари билан ёзинг.", "qr": "Напишите состав и дозы Пасивалема.", "au": "5-HTP — гидрокситриптофан — 100 мг; магний — 100 мг; пассифлора — 300 мг; мелисса — 80 мг; валериана — 120 мг.", "ar": "5-HTP — гидрокситриптофан — 100 мг; магний — 100 мг; пассифлора — 300 мг; мелисса — 80 мг; валериана — 120 мг."}, {"qu": "Пасивалем таркибидаги магний нима вазифани бажаради?", "qr": "Какова функция магния в Пасивалеме?", "au": "Магний асосан енергия ишлаб чиқариш ёки истеъмол қилиш билан боғлиқ бўлган турли хил метаболик жараёнларда иштирок етади. Шунингдек, у кўплаб ферментларнинг таъсирини кучайтиради, нерв-мушак қўзғалувчанлигини, юрак фаолиятини тартибга солишда, қон томир тонусини нормаллаштиришда ва электролитлар мувозанатини сақлашда иштирок етади.", "ar": "Магний участвует в различных процессах обмена веществ, в основном связанных с выработкой или потреблением энергии. Также он усиливает действие множества ферментов, участвует в регуляции нервно-мышечной возбудимости, сердечной деятельности, нормализации сосудистого тонуса, поддержании электролитного баланса."}, {"qu": "Пасивалем таркибидаги пассифлора нима вазифани бажаради?", "qr": "Какую функцию выполняет страстоцвет в Пасивалеме?", "au": "Пассифлора гул екстракти (шунингдек, эҳтиросли гул деб аталади) Пассифлора инкарната ўсимликидан олинади.\nУ енгил тинчлантирувчи таъсирга ега, ташвиш, асабийлашиш ва асабий тарангликни олдини олади, менопауза касалликларига ижобий таъсир кўрсатади ва ҳайздан олдинги синдромни енгиллаштиради.", "ar": "Экстракт пассифлоры (другое название страстоцвет) получают из растения Passiflora incarnata.\nОказывает легкое успокаивающее действие, препятствует беспокойству, раздражительности и нервному напряжению, оказывает положительное действие при климактерических расстройствах, облегчает состояние при предменструальном синдроме.\nРусское название Страстоцвет является переводом латинского названия (страсть + цветок)."}, {"qu": "Пасивалем таркибидаги валериана нима вазифани бажаради?", "qr": "Какую функцию выполняет валериана в Пасивалеме?", "au": "Valerian енгил тинчлантирувчи таъсирга ега, уйқуни яхшилашга ва унинг давомийлигини оширишга ёрдам беради, ухлашни осонлаштиради, шунингдек, асаб тизимининг атроф-муҳитнинг салбий омилларига чидамлилигини оширади.", "ar": "Валериана обладает мягким успокаивающим действием, способствует улучшению сна и увеличению его длительности, облегчает засыпание, а также повышает устойчивость нервной системы к неблагоприятным факторам окружающей среды."}, {"qu": "Пасивалем таркибидаги мелисса нима вазифани бажаради?", "qr": "Какую функцию выполняет мелисса в Пасивалеме?", "au": "Melissa-эфир мойлари мавжудлиги сабабли у лимоннинг ўзига хос ёқимли ҳиди ва таъмига ега, бу лимон балзамининг бошқа номлари – лимон балзам, лимон ўтлари билан боғлиқ. Melissa метаболизмни, овқат ҳазм қилишни яхшилашга ёрдам беради, иштаҳани ва ич қотишини оширади. Лимон балзамининг тинчлантирувчи ва тасалли берувчи хусусиятлари асаб тизимига фойдали таъсир кўрсатадиган диетани чеклашга ёрдам беради. Лимон ўти аёллар учун ойлик касалликлар (ҳайз кўриш) пайтида, шунингдек менопауза (менопауза) аломатларини камайтириш учун ҳам ишлатилиши мумкин.", "ar": "Мелисса благодаря наличию эфирных масел имеет специфический приятный запах и вкус лимона, с чем связаны другие названия мелиссы — мелисса лимонная, лимонная трава. Мелисса помогает улучшить обмен веществ, пищеварение, повышает аппетит, помогает при запоре. Успокаивающие и расслабляющие свойства мелиссы помогают при ограничениях, связанных с диетой, благотворно влияя на нервную систему. Лимонную траву также можно применять женщинам во время ежемесячных недомоганий (менструаций), а также для уменьшения проявлений менопаузы (климакса)."}, {"qu": "5-HTP қандай синтезланади?", "qr": "Как синтезируется 5-HTP?", "au": "5-гидрокситриптофан муҳим аминокислота триптофаннинг ҳосиласидир. Танага киргандан сўнг, триптофан 5-гидрокситриптофанга айланади, ундан сератонин танада бевосита ҳосил бўлади. Ва сератонин, марказий асаб тизимининг тартибга солувчи воситачиси бўлиб, инсоннинг ҳиссий ҳолатига фойдали таъсир кўрсатади, бунинг учун у \"бахт гормони\" деб номланган.\"", "ar": "5-гидрокситриптофан — это производное незаменимой аминокислоты триптофана. Попадая в организм, триптофан превращается в 5-гидрокситриптофан, из которого в организме непосредственно образуется серотонин. А серотонин, будучи регуляторным медиатором центральной нервной системы, оказывает благотворное воздействие на эмоциональное состояние человека, за что и получил название «гормон счастья»."}, {"qu": "Пасивалем таркибидаги 5-HTP нима вазифани бажаради?", "qr": "Какова функция 5-HTP в Пасивалеме?", "au": "5-HTP — гидрокситриптофан — сератониндан олдинги махсулот ҳисобланади ва триптофандан — L-триптофан ва 5-гидрокситриптофан синтез бўлади. 5-гидрокситриптофан қанчалик кўп бўлса шунчалик кайфият кўтарилади ва уйқу яхшиланади.", "ar": "5-HTP — гидрокситриптофан — является предшественником серотонина, а из триптофана синтезируются L-триптофан и 5-гидрокситриптофан. Чем больше 5-гидрокситриптофана, тем лучше настроение и сон."}, {"qu": "Пасивалемнинг 5 та непрямой конкурентларини кўрсатинг. Сиз непрямой конкурентларга қарши қандай иш олиб борасиз?", "qr": "Назовите 5 косвенных конкурентов Пасивалема. Как вы боретесь с косвенными конкурентами?", "au": "Персен ночь, Вамелан, Седавит, Модус ночь, Палора найт. Буларга қарши асосан таркибимиздаги 5-HTP ва бошқа қўшимча моддаларнинг катта дозада мавжудлиги ва кунига 1 махал қабул қилиниши ва нафақат уйқуни яхшилаши, балки, ПМС, климаксда ҳам самарали таъсир кўрсатиши айтилади.", "ar": "Персен ночь, Вамелан, Седавит, Модус ночь, Палора найт. Основная причина этого заключается в том, что наш продукт содержит большие дозы 5-HTP и других добавок, которые принимаются один раз в день и, как утверждается, не только улучшают сон, но и оказывают эффективное воздействие при ПМС и менопаузе."}, {"qu": "Пасивалем учун кўрсатмалар.", "qr": "Показания к применению Пасивалема.", "au": "Уйқу давомийлиги ва уйқу сифатини яхшилаш учун, предменструал синдромда, климакс даврида нерв қўзғалишларида тинчлантирувчи сифатида, овқат ҳазм қилишда ҳам фойдали бўлиши мумкин.", "ar": "Для улучшения продолжительности и качества сна, при предменструальном синдроме, как седативное средство при нервном возбуждении во время климакса, также может быть полезен для пищеварения."}, {"qu": "Пасивалемнинг камчиликлари.", "qr": "Недостатки Пасивалема.", "au": "Таркибида 5 хил модда сақлаши, бу қайсидир моддага нисбатан организмда сезувчанлик бўлиши мумкин, 12 ёшгача бўлган болаларга ва ҳомиладорларда ва эмизикли аёлларда қўллаш бўйича тадқиқот ўтказилмаганлиги", "ar": "Содержит 5 различных ингредиентов, которые могут вызывать чувствительность к некоторым из них, и не изучалось на предмет применения у детей младше 12 лет, беременных или кормящих женщин."}]}, {"name": "Бикарбонорм", "items": [{"qu": "Сийдик-айириш системаси аъзоларига қайсилар киради?", "qr": "Каковы органы мочевыделительной системы?", "au": "буйраклар, cийдик йўли, сийдик жоми, сийдик чиқариш йўли", "ar": "почки, мочеточники, мочевой пузырь, мочевыводящие пути"}, {"qu": "Буйракнинг ички тузилишини таърифланг.", "qr": "Опишите внутреннее строение почки.", "au": "—", "ar": "—"}, {"qu": "Метаболик ацидоз нима?", "qr": "Что такое метаболический ацидоз?", "au": "Қоннинг pH муҳитининг 7.35 дан тушиб кетиши метаболик ацидоз деб аталади. Нормада 7.35-7.45 бўлиши керак. Яъни бошқачароқ қилиб таърифлаайдиган бўлсак қондаги кислоталик муҳитни ошиб кетишига метаболик ацидоз дейилади. Метаболик ацидоз буйрак функцияси бузилганда ёки бошқа сабабларга кўра қондаги кислоталик муҳит ошиб гидрокарбонат ионлари миқдори камайиб кетганда пайдо бўлади ва бу сурункали буйрак касаллигини прогрессланиб кетишига сабаб бўлади.", "ar": "Снижение pH крови ниже 7,35 называется метаболическим ацидозом. Норма должна быть 7,35–7,45. Другими словами, метаболический ацидоз — это повышение кислотности крови. Метаболический ацидоз возникает при нарушении функции почек или по другим причинам, из-за которых кровь становится более кислой и количество ионов бикарбоната уменьшается, что приводит к прогрессированию хронического заболевания почек."}, {"qu": "Респиратор ацидоз нима?", "qr": "Что такое респираторный ацидоз?", "au": "Респиратор ацидоз бу — қондаги карбонат ангидриднинг миқдори 44 мм симоб устунидан ошиб кетишидир. Респиратор ацидозни соғлом одамда ўпка компенсатор вазифасини бажаради, яъни тез тез нафас олиш ёрдамида карбонат ангидрид миқдорини камайтиради.", "ar": "Респираторный ацидоз — это состояние, при котором уровень углекислого газа в крови превышает 44 мм рт. ст. У здорового человека легкие компенсируют респираторный ацидоз, уменьшая количество углекислого газа за счет учащенного дыхания."}, {"qu": "Буйракнинг компенсатор вазифаси қандай намоён бўлади?", "qr": "Как проявляется компенсаторная функция почки?", "au": "Соғлом одамда буйраклар қондаги гидрокарбонат ионларини нормасини таъминлаб беради, яъни агар қонда гидрокарбонат ионлари миқдори кўп бўлса буйрак каналчалари орқали кўпроқ чиқариб юборилади, агар гидрокарбонат ионлари миқдори кам бўлса, буйрак каналчалари орқали гидрокарбонат ионлари ушлаб қолинади. Шу орқали буйрак компенсатор ҳусусиятини намоён қилади.", "ar": "У здорового человека почки поддерживают нормальный уровень ионов бикарбоната в крови, то есть если количество ионов бикарбоната в крови высокое, больше их выводится через почечные канальцы, тогда как если количество ионов бикарбоната низкое, больше ионов бикарбоната задерживается через почечные канальцы. Таким образом, почка проявляет компенсаторные свойства."}, {"qu": "Метаболик ацидоз сабабларини ёзинг.", "qr": "Напишите причины метаболического ацидоза.", "au": "кетоацидоз, лактоацидоз, буйрак етишмовчилиги, кислоталар метаболизмидан ҳосил бўладиган токсинлар, гидрокарбонат ионларининг буйраклар ёки ошқозон ичак тракти томонидан йўқотилиши, парентрал дори воситалари (аминокислоталар), урологик операциялар", "ar": "Кетоацидоз, лактоацидоз, почечная недостаточность, токсины, образующиеся при кислотном обмене веществ, потеря ионов бикарбоната почками или желудочно-кишечным трактом, парентеральные препараты (аминокислоты), урологические операции."}, {"qu": "Метаболик ацидозни симптомлари қайсилар?", "qr": "Каковы симптомы метаболического ацидоза?", "au": "кўнгил айниши, қусиш, бош оғриғи, уйқусизлик, диарея, мушакларда толиқиш, қалтираш, хансираш, йўтал, аритмия", "ar": "Тошнота, рвота, головная боль, бессонница, диарея, мышечная усталость, тремор, одышка, кашель, аритмия."}, {"qu": "Метаболик ацидозни қандай ташхислаш усуллари бор?", "qr": "Как диагностировать метаболический ацидоз?", "au": "асосан қондаги гидрокарбонат ионлари миқдорига қараб (КШС), умумий қон таҳлили, натрий, калий, мочевина ва креатинин миқдорига қараб ва ташқи симптомларига қараб ташхис қўйилади", "ar": "Диагностируется в основном на основании количества ионов бикарбоната в крови (КЩС), общего анализа крови, уровня натрия, калия, мочевины и креатинина, а также внешних симптомов."}, {"qu": "Буйрак тубуляр ацидозини қандай типларини биласиз?", "qr": "Какие типы почечного тубулярного ацидоза вы знаете?", "au": "буйрак тубуляр ацидозининг 3 та типи асосий ўрганилади, буйрак тубуляр ацидози буйракнинг просимал каналчаларидан гидрокарбонат ионларининг экскрецияси ёки реобсорбциясининг бузилиши ва альдостерон механизмини бузилишидан келиб чиқади", "ar": "Изучаются три основных типа почечного канальцевого ацидоза. Почечный канальцевый ацидоз возникает в результате нарушения экскреции или реабсорбции ионов бикарбоната из проксимальных канальцев почек и нарушения механизма альдостерона."}, {"qu": "Бикарбонорм препаратига умумий таъриф.", "qr": "Общее описание препарата Бикарбонорм.", "au": "Бикарбонорм гастрорезистент таблетка ҳисобланади ва айнан махсус қобиқ билан қопланган. Бу гастрорезистент қобиқ ҳисобланади ва ошқозонни кислотали мухитига чидамли. Препарат ичакда эрийди ва қонга 100% сўрилади. Қонни гидрокарбонат ионлари билан таъминлайди ва кислотали муҳитни нейтраллайди. Ножўя таъсирларини камайтириш мақсадида таблетка таркибига симетикон моддаси қўшилган ва бу орқали метеоризм, газ ҳосил бўлиш жараёнлари нисбатан камайтирилиши мумкин.", "ar": "Бикарбонорм — гастрорезистентная таблетка, покрытая специальной оболочкой. Это гастрорезистентная оболочка, устойчивая к кислой среде желудка. Препарат растворяется в кишечнике и на 100% всасывается в кровь. Он снабжает кровь ионами бикарбоната и нейтрализует кислую среду. Для снижения побочных эффектов в состав таблетки добавлен симетикон, благодаря которому удается относительно снизить процессы метеоризма и газообразования."}, {"qu": "Бикарбонорм препаратининг фармакокинетикаси.", "qr": "Напишите фармакокинетику препарата Бикарбонорм.", "au": "Бикарбонормни перорал қабул қилгандан сўнг ошқозонга тушади ва эримасдан ичакка ўтади ва ичакда эрийди. Ичакдан қонга сўрилганда гидрокарбонат ионлари алоҳида ажралади. Қонда гидрокарбонат ионлари ўз вазифасини бажаргандан сўнг сув ва карбонат ангидрид ҳолида организмдан чиқиб кетади.", "ar": "После приема внутрь Бикарбонорм попадает в желудок и в нерастворенном виде проходит в кишечник, где растворяется. При всасывании в кровь из кишечника ионы бикарбоната разделяются. После того как ионы бикарбоната в крови выполнили свою функцию, они покидают организм в виде воды и углекислого газа."}, {"qu": "Бикарбонорм препарати учун кўрсатма.", "qr": "Показания к применению Бикарбонорма.", "au": "14 ёш ва ундан катта бўлган сурункали буйрак касаллиги ва буйрак тубуляр касаллигига чалинган беморларда метаболик ацидозни коррекция қилиш учун ва унинг рецидивини олдини олиш учун қўлланилади.", "ar": "Применяется для коррекции метаболического ацидоза и профилактики его рецидивов у пациентов в возрасте 14 лет и старше с хронической болезнью почек и заболеванием почечных канальцев."}, {"qu": "Бикарбонорм препаратининг ножўя таъсирлари.", "qr": "Побочные эффекты таблетки Бикарбонорм.", "au": "Гипокалиемия, алкалоз, QT интервали чўзилиши, мушакларда ҳолсизлик, қалтираш, ионлашган гипокальциемия, гиперкапния, қорин соҳасида абдоминал оғриқлар, метеоризм, буйракларда фосфат тузларини йиғилишига олиб келиши мумкин.", "ar": "Может вызвать гипокалиемию, алкалоз, удлинение интервала QT, мышечную слабость, тремор, ионизированную гипокальциемию, гиперкапнию, боли в животе, метеоризм и накопление фосфатных солей в почках."}, {"qu": "Бикарбонорм препаратини қўллаш мумкин бўлмаган ҳолатлар.", "qr": "Напишите противопоказания к применению препарата Бикарбонорм.", "au": "Гипокалиемия, алкалоз, гипернатриемия, натрий сақлаган диета", "ar": "Гипокалиемия, алкалоз, гипернатриемия, диета с низким содержанием натрия."}, {"qu": "Бикарбонорм учун 3 та FAB ёзинг.", "qr": "Напишите 3 FAB для Бикарбонорма.", "au": "1. Таблетка форма. 2. Гастрорезистент қобиқ. 3. Ёрдамчи модда сифатида симетикон.", "ar": "1. Таблетированная форма. 2. Гастрорезистентная оболочка. 3. Симетикон как вспомогательное вещество."}, {"qu": "Нима учун сода буфер инфузия формасидан натрия бикарбонат таблетка формасини афзалроқ деб биласиз?", "qr": "Почему вы предпочитаете таблетированную форму бикарбоната натрия, а не инфузионную форму содового буфера?", "au": "Чунки эритма формани беморга қўллаш учун ҳар доим стационар шароит, тиббий персонал, стерил шароит талаб қилади. Ундан ташқари агар эритма форма дозаси назорат қилинмаса алкалоз ҳолатига олиб келиши мумкин. Таблетка узоқ муддат қабул қилишга қулай.", "ar": "Потому что применение растворной формы у пациента всегда требует стационарных условий, медицинского персонала, стерильных условий. Кроме того, если дозировка растворенной формы не контролируется, это может привести к состоянию алкалоза. Таблетку удобно принимать в течение длительного времени."}, {"qu": "Алкалоз нима? Қачон алкалоз содир бўлиши мумкин?", "qr": "Что такое алкалоз? Когда может развиться алкалоз?", "au": "Алкалоз бу қондаги ишқорий муҳитнинг ошиб кетиши. pH кўтарилиб, водород ионларининг миқдорининг нормадан тушиб кетиши алкалоз ҳисобланади. Алкалоз ҳаёт учун хавфли.", "ar": "Алкалоз — это избыток щелочной среды в крови. Алкалоз — это состояние, при котором pH повышается, а количество ионов водорода падает ниже нормы. Алкалоз опасен для жизни."}, {"qu": "Нима учун айнан сурункали буйрак касаллигида биз Бикарбонормни таклиф қиламиз?", "qr": "Почему мы рекомендуем Бикарбонорм именно при хронической болезни почек?", "au": "Сурункали буйрак касаллигида метаболик ацидоз пайдо бўлиши бу касалликни прогрессланиб, диализ ҳолатига тушишни тезлашишига олиб келиши мумкин. Метаболик ацидозни коррекция қилиш орқали сурункали буйрак касаллигини прогрессланишини секинлаштириш мумкин.", "ar": "Развитие метаболического ацидоза при хронической болезни почек может ускорить прогрессирование заболевания и привести к необходимости проведения диализа. Коррекция метаболического ацидоза позволяет замедлить прогрессирование хронического заболевания почек."}, {"qu": "Бикарбонормнинг 3 та непрямой конкурентини ва уларга қарши ишлаш тактикасини ёзинг.", "qr": "Напишите 3 косвенных конкурента Бикарбонорма и тактику борьбы с ними.", "au": "р/р Сода буфер 4% 200,0 мл, натрия гидрокарбонат 4% 200,0 мл (Юрия фарм); натрия гидрокарбонат 4% 200,0 мл (Дентафилл), кетостерил, проренал. Эритма формани беморга қўллаш учун ҳар доим стационар шароит, тиббий персонал, стерил шароит талаб қилади. Ундан ташқари агар эритма форма дозаси назорат қилинмаса алкалоз ҳолатига олиб келиши мумкин. Таблетка узоқ муддат қабул қилишга қулай.", "ar": "р-р Сода буфер 4% 200,0 мл, натрия гидрокарбонат 4% 200,0 мл (Юрия-Фарм); натрия гидрокарбонат 4% 200,0 мл (Дентафилл), Кетостерил, Проренал. Применение растворной формы у пациента всегда требует стационарных условий, медицинского персонала, стерильных условий. Кроме того, если дозировка растворенной формы не контролируется, это может привести к состоянию алкалоза. Таблетку удобно принимать в течение длительного времени."}]}, {"name": "Black Garlic", "items": [{"qu": "Статинларнинг механизмини ёзинг.", "qr": "Напишите механизм действия статинов.", "au": "Статинлар мевалонат кислота ҳосил бўлишида қатнашадиган асосий фермент ГМГ КоА-редуктаза ферментини ингибирлайди. Натижада жигарда синтезланадиган холестерин миқдори камаяди.", "ar": "Статины ингибируют фермент ГМГ-КоА-редуктазу, основной фермент, участвующий в образовании мевалоновой кислоты. В результате количество синтезируемого в печени холестерина уменьшается."}, {"qu": "Статинларнинг ножўя таъсирларини ёзинг.", "qr": "Напишите побочные эффекты статинов.", "au": "Асосан жигарга гепатотоксик таъсир кўрсатади, ГМГ КоА редуктаза ферментини ингибирлаганлиги учун, кофермент Q синтези камаяди ва мушакларда АТФ синтезига таъсир қилади, бу эса статинларни узоқ вақт ичиш давомида мушакларда миалгия ва рабдомиолиз яъни мушакларда кучли оғриқлар пайдо бўлишига олиб келади.", "ar": "Оказывает гепатотоксическое действие, главным образом на печень, так как ингибирует фермент ГМГ-КоА-редуктазу, снижает синтез кофермента Q и влияет на синтез АТФ в мышцах, что приводит к развитию миалгий и рабдомиолиза, то есть сильных мышечных болей, при длительном применении статинов."}, {"qu": "Black Garlic нинг 3 та таъсир механизмини ёзинг.", "qr": "Напишите 3 механизма действия Блек Гарлик.", "au": "жигарда ҳолсетерин синтезини камайтириш, ўт суюқлиги билан биргаликда холестеринни олиб чиқиб кетиш, холестеринни оксидланишини блоклаш", "ar": "Снижение синтеза холестерина в печени, выведение холестерина с желчью, блокирование окисления холестерина."}, {"qu": "Сиз врачнинг Black Garlic учун эҳтиёжини қандай аниқлайсиз?", "qr": "Как определить потребность врача в назначении Блек Гарлик?", "au": "Асосан статинни ножўя таъсирларидан келиб чиқиб (давомини тўлиқ ёзинг)", "ar": "В основном из-за побочных эффектов статинов (напишите полностью)."}, {"qu": "Black Garlic нинг кўрсатмаларини ёзинг.", "qr": "Напишите показания к применению препарата Блек Гарлик.", "au": "Гиперхолестеринемия, гипертриглицеридемия;\nқон босимини тартибга солиш;\nОвқат ҳазм қилиш ва қон айланишини яхшилаш учун;\nИммунитет тизимини қўллаб-қувватлаш учун;\nГепатопротектив таъсирга эришиш учун;\nТанадан токсинларни олиб ташлаш учун;\nэнергия манбаи сифатида...", "ar": "Гиперхолестеринемия, гипертриглицеридемия;\nДля регулирования кровяного давления;\nДля улучшения пищеварения и кровообращения;\nДля поддержки иммунной системы;\nДля достижения гепатопротекторного действия;\nДля выведения токсинов из организма;\nВ качестве источника энергии..."}, {"qu": "Black Garlic учун 3 та FAB ёзинг.", "qr": "Напишите 3 FAB для Блек Гарлик.", "au": "1. Жигарда холестерин синтезини камайтирувчи табиий, хавфсиз, ножўя таъсирга эга бўлмаган восита. Бу беморга хавфсизлик беради. 2. 3 хил таъсир механизмига эга. Самарадорлик беради. 3. Жигарда АЛТ, АСТ ферментлари ошган, статинга нисбатан жудаям кўп ножўя таъсир сезадиган беморларга энг яхши танлов. Қулайлик беради.", "ar": "1. Натуральное, безопасное, не имеющее побочных эффектов средство, снижающее синтез холестерина в печени. Это обеспечивает безопасность пациента. 2. Имеет 3 различных механизма действия. Дает эффективность. 3. Лучший выбор для пациентов с повышенными уровнями печеночных ферментов АЛТ и АСТ, которые испытывают слишком много побочных эффектов от статинов. Удобство."}, {"qu": "Black Garlic учун 5 та непрямой конкурент (савдо номини) ёзинг.", "qr": "Напишите 5 непрямых конкурентов Блек Гарлик (торговые названия).", "au": "Аторис, Роксера, Аторвакор, Розулип, Розулесс", "ar": "Аторис, Роксера, Аторвакор, Розулип, Розулесс."}, {"qu": "ЛПНП, ЛПВП, ТГ ларни тўлиқ вазифаларини ёзинг.", "qr": "Напишите полные функции ЛПНП, ЛПВП и ТГ.", "au": "Зичлиги паст бўлган липопротеидлар (ПЗЛП) организмда холестерин ташиш вазифасини бажаради ва уларнинг кўпайиши томирлар деворларида ёғларнинг тўпланишига олиб келиши мумкин. ПЗЛП миқдорининг ортиб кетиши атеросклероз ва унинг пайдо бўлиши, инсульт, периферик артериялар окклюзиясининг хавфини ошириб юбориши мумкин. Юқори зичликдаги липопротеидлар (ЮЗЛП) асосий қисми оқсилдан ва камроқ холестериндан иборат. Уларнинг асосий функцияси — ортиқча холестеринни жигарга олиб келишдан иборат ва у ердан ўт кислотаси сифатида ажралади. Шунинг учун ҳам ЮЗЛП \"яхши холестерин\" деб ҳам номланади. Триглицеридлар — булар организмда муҳим захира энергия манбаи ҳисобланади. Агарда қон айланишида ортиқча триглицеридлар бўлса, улар ёғ тўқимасида захираланади. Триглицеридлар ва ПЗЛП миқдорининг ортиши юрак-қон томир касалликларининг хавфини ошириб юборади.", "ar": "ЛПНП переносят в организме холестерин, и их повышенный уровень может вызывать жировые отложения в стенках сосудов (как правило, в артериях). Уровень холестерина ЛПНП коррелирует с высоким риском развития атеросклероза и таких его проявлений, как инфаркт миокарда, инсульт и окклюзия периферических артерий. Липопротеины высокой плотности состоят в основном из белковой части и содержат немного холестерина. Их основная функция — переносить излишки холестерина обратно в печень, откуда они выделяются в виде желчных кислот. Поэтому холестерин ЛПВП (ХС ЛПВП) также называют «хорошим холестерином». Триглицериды — это важный запасной источник энергии в организме. Если в кровообращении имеется избыток триглицеридов, то часть их депонируется в жировую ткань. Увеличенное содержание триглицеридов и холестерина ЛПНП указывает на повышенный риск сердечно-сосудистых заболеваний."}, {"qu": "Холестериннинг вазифаларини ёзинг.", "qr": "Напишите функции холестерина.", "au": "Холестериннинг асосий вазифаси ҳужайра мембранасини ташкил қилади. Ундан ташқари стероид гормонлар синтези учун асосий манба ҳисобланади. Холестерин нормада инсон саломатлиги учун муҳим ҳисобланади ва нормадан ортиғи юрак-қон томир касалликлари хавфини ошириб юборади.", "ar": "Основная функция холестерина — формирование клеточной мембраны. Кроме того, он является основным источником синтеза стероидных гормонов. Нормальный уровень холестерина необходим для здоровья человека, а его избыточный уровень увеличивает риск сердечно-сосудистых заболеваний."}, {"qu": "Атеросклероз нима ва у қандай ҳосил бўлади?", "qr": "Что такое атеросклероз и как он формируется?", "au": "Атеросклероз организмда қон томирининг ички қавати яъни эндотелиал қаватнинг дисфункцияси ва ПЗЛП миқдорининг ортиши, ундан ташқари гиподинамия, ёғли овқат кўп истеъмол қилиш, чекиш ва ичиш натижасида ривожланади. Эндотелиал дисфункция натижасида эндотелий қаватига ПЗЛП ўтади ва у ерда кўпиксимон ҳужайра ҳосил қилади, вақт ўтиб бу кўпиксимон ҳужайра қаттиқлашади ва эндотелий қаватида пилакчага айланади ва қон томири бўшлиғига бўртиб чиқади. Шу тариқа атеросклероз ривожланади.", "ar": "Атеросклероз развивается в результате нарушения функции внутреннего слоя кровеносных сосудов — эндотелиального слоя и увеличения количества ЛПНП, а также гиподинамии, чрезмерного употребления жирной пищи, курения и употребления алкоголя. В результате эндотелиальной дисфункции ЛПНП перемещается в эндотелиальный слой, где образует пенистую клетку, которая со временем затвердевает и превращается в бляшку в эндотелиальном слое и выступает в полость сосуда. Так развивается атеросклероз."}]}, {"name": "Эвалеп", "items": [{"qu": "Эвалепнинг таъсир механизмини ёзинг", "qr": "Напишите механизм действия Эвалепа.", "au": "Эвалеп синаптик везикулалар юзазида жойлашган SV2A рецепторларини блоклаш орқали везикулалардан ажраладиган нейромедиаторларнинг синаптик бўшлиққа чиқишини модуляция қилади. Ундан ташқари ГАМК эргик тормозланишни кучайтиради ва Са+ каналларига ҳам таъсир кўрсатади.", "ar": "Эвалеп путем блокирования рецепторов SV2A, расположенных на поверхности синаптических везикул, модулирует высвобождение нейромедиаторов из везикул в синаптическую щель. Кроме того, он усиливает ГАМК-ергическое торможение и оказывает влияние на кальциевые (Ca²⁺) каналы."}, {"qu": "Эвалеп учун кўрсатмаларни ёзинг", "qr": "Напишите показания к применению Эвалепа.", "au": " Эвалеп 16 ёшдан ошган беморларда иккиламчи генерализация билан ёки усиз янги аниқланган парциал тутқаноқни бошланғич даволашда монотерапия сифатида маъқулланган.\nМажмуавий (комплекс) даволаш таркибида:\n– Ювенил миоклоник тутқаноғи бор катталар ва 12 ёшдан ошган ўсмирларда миоклоник тутқаноқларни даволашда;\n– Идиопатик генерализациялашган тутқаноғи бор катталар ва 12 ёшдан ошган ўсмирларда бирламчи-генерализациялашган тоник-клоник тутқаноқ хуружларини даволашда қўлланилади.", "ar": "Эвалеп одобрен в монотерапии для стартового лечения впервые выявленной парциальной эпилепсии у пациентов с 16 лет, со вторичной генерализацией или без нее.\nВ составе комплексной терапии при лечении:\n– миоклонических судорог у взрослых и подростков старше 12 лет с ювенильной миоклонической эпилепсией;\n– первично-генерализованных судорожных тонико-клонических припадков у взрослых и подростков старше 12 лет с идиопатической генерализованной эпилепсией."}, {"qu": "Эвалепни бошқа тутқаноққа қарши препаратлардан асосий устунликлари нимада?", "qr": "В чем основные преимущества Эвалеп перед другими противосудорожными (противоэпилептическими) препаратами?", "au": "Биринчидан, ноёб таъсир механизми: синаптик везикула оқсили SV2A билан боғланиб, нейротрансмиттерларнинг ортиқча ажралишини танлаб блоклайди. Иккинчидан, жигар цитохром P450 тизимида метаболизмга учрамайди, шунинг учун дорилар билан ўзаро таъсири (drug-to-drug interaction) деярли йўқ. Учинчидан, тез таъсир бошланиши (дозани узоқ вақт титрлаш шарт эмас) ва кенг терапевтик индекс.", "ar": "Во-первых, уникальный механизм действия: селективное связывание с белком синаптических везикул SV2A, что избирательно тормозит гиперсинхронный выброс возбуждающих нейромедиаторов. Во-вторых, отсутствие печеночного метаболизма через систему цитохрома P450, что минимизирует лекарственные взаимодействия. В-третьих, быстрое достижение терапевтического эффекта без необходимости длительного и ступенчатого титрования дозы."}, {"qu": "Эвалепнинг валпроат кислотасидан (Депакин ва б.) асосий фарқлари ва устунликлари нимада?", "qr": "В чем отличия и преимущества Эвалеп перед препаратами вальпроевой кислоты (Депакин и др.)?", "au": "Валпроат кислотаси гепатотоксиклик, вазн ортиши, соч тўкилиши, тромбоцитопения ва энг муҳими — юқори тератогенлик (ҳомила нуқсонлари хавфи 10% гача) хавфига эга. Эвалеп жигарга зарар етказмайди, тана вазнига ва липид профилига таъсир қилмайди ҳамда фертил ёшдаги аёлларда тератогенлик хавфи валпроатга нисбатан сезиларли даражада паст ва хавфсизроқдир.", "ar": "Вальпроаты сопряжены с риском гепатотоксичности, увеличения массы тела, алопеции, тромбоцитопении и выраженной тератогенности (риск пороков развития до 10%). Эвалеп метаболически нейтрален, не вызывает гепатотоксичности, не влияет на массу тела и обладает существенно более благоприятным профилем тератогенной безопасности у женщин репродуктивного возраста."}, {"qu": "Эвалеп Карбамазепиндан (Финлепсин) нимаси билан устун туради?", "qr": "Чем Эвалеп превосходит Карбамазепин (Финлепсин)?", "au": "Карбамазепин кучли жигар ферментлари индуктори (CYP3A4) бўлиб, бошқа препаратлар (юрак, гипотензив, контрацептивлар) таъсирини кескин пасайтиради. Шунингдек, кардиотоксиклик (аритмиялар), тери аллергик реакциялари (Стивенс-Джонсон синдроми) ва гипонатриемия хавфи бор. Эвалеп фермент индуктори эмас, кардиохавфсиз ва комбинацияланган даволашда муаммо туғдирмайди.", "ar": "Карбамазепин является мощным индуктором ферментов печени (CYP3A4), изменяя метаболизм сопутствующих лекарств (включая оральные контрацептивы, кардиологические средства). Он также несет риски синдрома Стивенса-Джонсона, гипонатриемии и кардиотоксичности. Эвалеп не индуцирует и не ингибирует ферменты печени, кардиобезопасен и идеален в политерапии."}, {"qu": "Эвалеп фонида қондаги дори концентрациясини (терапевтик мониторинг) доимий назорат қилиш керакми?", "qr": "Требуется ли постоянный терапевтический лекарственный мониторинг концентрации в крови при приеме Эвалеп?", "au": "Йўқ, Эвалеп 100% га яқин биокираолишликка ва чизиқли, олдиндан тахмин қилинадиган фармакокинетикага эга. Валпроат, карбамазепин ёки фенитоин каби препаратлардан фарқли равишда, Эвалеп қабул қилганда қон зардобидаги концентрацияни мунтазам лаборатория текширувидан ўтказиш талаб этилмайди.", "ar": "Нет, Эвалеп обладает практически 100% биодоступностью и линейной предсказуемой фармакокинетикой. В отличие от вальпроатов, карбамазепина и фенитоина, терапевтический лекарственный мониторинг (ТЛМ) рутинно не требуется, что делает терапию удобной и экономически выгодной для пациента."}, {"qu": "Эвалепнинг даволаш самараси қачон бошланади ва титрация даври қандай?", "qr": "Как быстро наступает эффект Эвалеп и каков период титрации по сравнению с конкурентами?", "au": "Эвалеп биринчи кунларданоқ самарали терапевтик дозаларга чиқиш имконини беради (масалан, 500 мг кунига 2 маҳалдан бошлаб, 1-2 ҳафтада тўлиқ назоратга эришилади). Ламотриджин (тери тошмалари хавфи сабабли бир неча ойлаб аста-секин титрланади) ёки топирамат каби препаратларга қараганда Эвалеп хуружларни тезроқ жиловлайди.", "ar": "Эвалеп позволяет быстро выйти на целевые терапевтические дозы (старт с 500 мг 2 раза в сутки, коррекция каждые 2 недели). В отличие от ламотриджина, требующего многонедельного титрования из-за риска тяжелых кожных сыпей, Эвалеп обеспечивает быстрый клинический ответ в ургентных и плановых ситуациях."}, {"qu": "Эвалепнинг кекса ёшдаги ва соматик хасталиги бор (полипрагмазияли) беморлардаги афзалликлари нимада?", "qr": "Каковы преимущества Эвалеп у пожилых пациентов и пациентов с коморбидной патологией?", "au": "Кекса ёшдаги беморлар кўпинча юрак-қон томир, диабет ва қон босимига қарши дориларни мунтазам ичишади. Эвалеп плазма оқсиллари билан боғланмайди (10% дан кам) ва жигарда метаболланмайди, шу сабабли бошқа ҳаётий муҳим дорилар билан
